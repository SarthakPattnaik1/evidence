<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvidenceReady — Know what to bring to your lawyer</title>
<meta name="description" content="Free preparation tool: answer a few questions and get a personal list of records to take to your advocate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Courier+Prime:wght@700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Oriya:wght@400;600&display=swap" rel="stylesheet">
<style id="appcss">/* EvidenceReady — "the case file" visual system */
:root{
  --paper:#F3F4EF; --sheet:#FFFFFF; --ink:#14254A; --ink2:#46536B; --muted:#6B7488;
  --manila:#E7D4A2; --manila-d:#C9B07A; --manila-l:#F4EAD0;
  --tape:#B02A23; --tape-l:#F7E3E0;
  --go:#0B7A6E; --go-d:#08655B; --go-l:#E1F1EE;
  --amber:#C98A16; --amber-l:#FBF0D9;
  --line:#D9DCD2; --focus:#2E5BD6;
  --display:"Bricolage Grotesque","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Devanagari","Noto Sans Oriya",system-ui,-apple-system,"Segoe UI",sans-serif;
  --typed:"Courier Prime","Courier New",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--go-d)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,h1[tabindex="-1"]:focus-visible,main:focus{outline:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.narrow{max-width:680px}

h1,h2,h3{font-family:var(--display);color:var(--ink);letter-spacing:-.015em;margin:0}
h1{font-size:clamp(34px,6.4vw,64px);line-height:1.02;font-weight:800}
h2{font-size:clamp(22px,3.2vw,30px);line-height:1.15;font-weight:700;margin-bottom:8px}
h3{font-size:18px;line-height:1.3;font-weight:700}
p{margin:0 0 12px}
.lead{font-size:clamp(17px,2.2vw,20px);color:var(--ink2);max-width:34em}
.muted{color:var(--muted)} .small{font-size:14px}

/* header */
header.top{position:sticky;top:0;z-index:30;background:rgba(243,244,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:6px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;color:var(--ink);background:none;border:0;cursor:pointer;padding:4px;margin-right:auto;letter-spacing:-.02em}
.nav{border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--ink2);font-weight:600;min-height:42px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.nav:hover{background:#E6E8E0;color:var(--ink)}
.nav.exit{background:var(--ink);color:#fff}
.lbl-short{display:none}
@media (max-width:640px){.nav .lbl-long{display:none}.nav .lbl-short{display:inline}.nav{padding:8px 7px;gap:4px;font-size:14px}.nav.lang .lbl-short{display:none}.brand{gap:7px}.brand span{font-size:16.5px}header.top .wrap{padding:0 12px;gap:2px}}
@media (max-width:380px){.brand span{display:none}}
body.calm.is-mobile .brand span{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1.5px solid transparent;padding:12px 20px;min-height:50px;font-weight:700;cursor:pointer;font-size:16px;text-decoration:none;font-family:var(--body)}
.btn.go{background:var(--go);color:#fff}
.btn.go:hover{background:var(--go-d)}
.btn.line{background:var(--sheet);border-color:var(--line);color:var(--ink)}
.btn.line:hover{border-color:var(--ink2)}
.btn.text{background:none;color:var(--go-d);padding:8px 4px;min-height:44px}
.btn.text:hover{text-decoration:underline}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ===== The file cover (hero) ===== */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;padding:52px 0 36px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:26px;padding:28px 0 18px}}
.hero .lead{margin-top:16px}
.cover{position:relative;background:var(--manila);border-radius:6px 18px 18px 18px;padding:34px 28px 26px 44px;box-shadow:0 1px 0 var(--manila-d),0 18px 40px -18px rgba(70,50,10,.45);isolation:isolate}
.cover::before{content:"";position:absolute;left:-1px;top:-22px;width:42%;height:24px;background:var(--manila);border-radius:10px 10px 0 0}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 6px);z-index:-1}
.tape{position:absolute;left:16px;top:-6px;bottom:-6px;width:10px;background:var(--tape);border-radius:2px;box-shadow:1px 0 0 rgba(0,0,0,.12)}
.cover .typed{font-family:var(--typed);font-size:15px;color:#5A4A22;margin:0 0 4px}
.cover label{display:block;font-family:var(--typed);font-size:15px;color:#5A4A22;margin-bottom:6px}
.matter{width:100%;background:transparent;border:0;border-bottom:2px solid #8E7740;font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:700;color:var(--ink);padding:8px 2px 10px;outline:none}
.matter::placeholder{color:#8E7740;opacity:.8;font-weight:600}
.matter:focus{border-bottom-color:var(--ink)}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.slipchip{background:var(--manila-l);border:1px solid var(--manila-d);border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer;color:#4A3C17}
.slipchip:hover{background:#fff}
.results{margin-top:14px;display:grid;gap:8px}
.res{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--manila-d);border-radius:10px;padding:12px 14px;cursor:pointer}
.res:hover{border-color:var(--ink)}
.res small{color:var(--muted);font-size:13px;white-space:nowrap}
.cover .foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;color:#5A4A22}

/* ===== Shelf: clubs as divider tabs ===== */
.shelf{margin:34px 0 10px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 0;margin:14px 0 0;border-bottom:2px solid var(--ink)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;background:#E6E8E0;border:0;border-radius:10px 10px 0 0;padding:10px 14px 9px;font-weight:700;font-size:14.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab:hover:not([aria-selected="true"]){background:#DADDD2}
.drawer{background:var(--sheet);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:8px 0}
.issue{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #ECEEE7;padding:15px 20px;cursor:pointer}
.issue:last-child{border-bottom:0}
.issue:hover{background:#F7F8F4}
.issue b{font-family:var(--display);font-size:17.5px;font-weight:700;color:var(--ink)}
.issue span{font-size:14px;color:var(--muted);grid-column:1}
.issue em{font-style:normal;grid-row:1/3;grid-column:2;font-size:13px;color:var(--ink2);background:var(--go-l);border-radius:999px;padding:4px 10px;white-space:nowrap}
.issue.gen em{background:#ECEEE7;color:var(--muted)}
@media (max-width:520px){.issue{grid-template-columns:1fr}.issue em{grid-row:auto;grid-column:1;justify-self:start;margin-top:4px}}

/* ===== Home: lower sections ===== */
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin:44px 0}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.qlist{list-style:none;padding:0;margin:12px 0 0}
.qlist li{border-bottom:1px solid var(--line)}
.qlist button{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 0;font-size:16.5px;font-weight:600;color:var(--ink);cursor:pointer}
.qlist button:hover{color:var(--go-d)}
.game{background:var(--ink);color:#fff;border-radius:18px;padding:26px;position:relative;overflow:hidden}
.game h2{color:#fff}
.game p{color:#C9D1E3}
.game .deck{position:relative;height:118px;margin:16px 0 20px}
.game .deck div{position:absolute;inset:0 10% 0 0;background:#fff;border-radius:12px;color:var(--ink);padding:16px;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.game .deck div:nth-child(1){transform:rotate(-5deg) translate(-6px,6px);background:#E8ECF5}
.game .deck div:nth-child(2){transform:rotate(3deg) translate(8px,2px);background:#F2F4F9}
.game .btn.go{background:var(--manila);color:var(--ink)}
.game .btn.go:hover{background:#F0DFB3}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:8px 0 40px;border-top:2px solid var(--ink)}
.how li{list-style:none;padding:16px 18px 0 0}
.how b{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px}
.how span{font-size:14.5px;color:var(--ink2)}
@media (max-width:760px){.how{grid-template-columns:1fr 1fr;row-gap:12px}}

/* ===== Quiz ===== */
.qwrap{padding:18px 0 140px}
.chapters{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--ink);margin-bottom:26px}
.chapters::-webkit-scrollbar{display:none}
.chap{flex:none;font-size:13px;font-weight:700;padding:8px 12px 6px;border-radius:9px 9px 0 0;background:#E6E8E0;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.chap.done{color:var(--ink2)}
.chap.done svg{color:var(--go)}
.chap.now{background:var(--ink);color:#fff}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;font-size:14px;color:var(--muted)}
.qtext{font-size:clamp(26px,4.6vw,38px);line-height:1.12;font-weight:800}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.opts{display:grid;gap:10px;margin:22px 0 18px}
.opt{position:relative;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-height:60px;cursor:pointer;font-size:17px;line-height:1.35;transition:transform .12s ease,border-color .12s}
.opt:hover{border-color:var(--ink2)}
.opt:active{transform:scale(.99)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.key{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--typed);font-weight:700;font-size:15px;color:var(--ink2);background:#F7F8F4}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:#F8F9FC}
.opt:has(input:checked) .key{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.why{border-left:3px solid var(--manila-d);background:var(--manila-l);padding:10px 14px;border-radius:0 10px 10px 0;font-size:15px;color:#4A3C17}
.why b{font-weight:700}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ===== The file tray (sticky) ===== */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none}
.tray .wrap{display:flex;justify-content:center}
.trayin{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--manila);border-radius:16px 16px 0 0;padding:12px 16px 12px 22px;box-shadow:0 -10px 30px -12px rgba(70,50,10,.4);min-width:min(560px,100%);position:relative}
.trayin::before{content:"";position:absolute;left:8px;top:8px;bottom:0;width:6px;background:var(--tape);border-radius:2px}
.trayin .count{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.trayin .lbl{font-size:13.5px;color:#4A3C17;line-height:1.25}
.trayin .btn{margin-left:auto;min-height:42px;padding:8px 14px;background:var(--ink);color:#fff;border-radius:10px;font-size:14.5px}
.flyslip{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600;max-width:300px;box-shadow:0 8px 24px rgba(20,37,74,.18);pointer-events:none}

/* ===== Chapter break ===== */
.break{padding:34px 0 140px}
.break .stamp{display:inline-block;font-family:var(--typed);font-weight:700;color:var(--tape);border:2.5px solid var(--tape);border-radius:6px;padding:4px 12px;transform:rotate(-4deg);margin-bottom:18px;font-size:16px}
.found{display:grid;gap:8px;margin:18px 0 22px}
.slip{background:#fff;border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:11px 14px;font-weight:600}
.tip{background:var(--ink);color:#fff;border-radius:14px;padding:18px 20px;margin:0 0 24px}
.tip b{font-family:var(--display);display:block;margin-bottom:4px;color:var(--manila)}

/* ===== Banners ===== */
.banner{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}
.banner.now{background:var(--tape-l);border:1.5px solid #E4AFA9}
.banner.soon{background:var(--amber-l);border:1.5px solid #ECCF91}
.banner.info{background:var(--go-l);border:1.5px solid #B5DCD5}
.banner.adv{background:#E8EDF7;border:1.5px solid #C2CDE4}
.banner svg{flex:none;margin-top:2px}
.banner h3{font-size:16.5px;margin:0 0 3px}
.banner p{margin:0;font-size:15px}

/* ===== Your file (evidence) ===== */
.filehead{background:var(--manila);border-radius:6px 16px 16px 16px;padding:24px 22px 20px 40px;position:relative;margin:26px 0 18px}
.filehead .tape{left:14px}
.filehead .typed{font-family:var(--typed);color:#5A4A22;font-size:15px;margin:0 0 4px}
.filehead h1{font-size:clamp(28px,5vw,44px)}
.stack{display:flex;gap:3px;margin:14px 0 6px}
.stack i{flex:1;height:8px;border-radius:3px;background:rgba(255,255,255,.55)}
.stack i.have{background:var(--go)} .stack i.find{background:var(--amber)} .stack i.others{background:var(--ink2)} .stack i.na{background:#B9A777}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:#4A3C17}
.ev{position:relative;background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:10px;padding:16px 16px 14px 18px;margin-bottom:12px}
.ev.flag{border-color:var(--ink);border-left-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ev h3{font-size:17.5px;padding-right:80px}
.ev .tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 6px}
.tag{font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.tag.time{background:var(--tape-l);color:var(--tape)} .tag.others{background:#E8EDF7;color:var(--ink)} .tag.act{background:#ECEEE7;color:var(--ink2)} .tag.adv{background:var(--ink);color:#fff}
.tag.draft{background:var(--amber-l);color:#7A5512}
.ev p.w{margin:0 0 6px;color:var(--ink2);font-size:15px}
.ev details{font-size:15px;margin:0 0 10px}
.ev summary{cursor:pointer;color:var(--go-d);font-weight:700}
.ev dl{margin:8px 0 0;display:grid;gap:4px}
.ev dt{font-weight:700;font-size:13.5px;color:var(--ink)}
.ev dd{margin:0 0 6px;color:var(--ink2)}
.sts{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:40px;font-weight:600;color:var(--ink2)}
.sbtn:hover{border-color:var(--ink2)}
.sbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.instamp{position:absolute;right:14px;top:12px;font-family:var(--typed);font-weight:700;color:var(--tape);border:2px solid var(--tape);border-radius:5px;padding:1px 8px;transform:rotate(-7deg);font-size:14px;background:#fff}
.instamp.pop{animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-7deg) scale(1.8);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.records{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--manila-l);border-radius:8px;padding:7px 12px;margin-bottom:6px;font-size:15px}
.rec code{font-family:var(--typed);font-weight:700;color:var(--tape);margin-right:8px}
.recform{display:grid;grid-template-columns:2fr 1fr 80px auto;gap:8px;align-items:end}
@media (max-width:620px){.recform{grid-template-columns:1fr 1fr}.recform .full{grid-column:1/-1}}
label.f{display:grid;gap:4px;font-size:13.5px;font-weight:700;color:var(--ink)}
.t{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:15px;min-height:46px;width:100%}
.t:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px #DCE3F3}
.deeper{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:18px 20px;margin:0 0 18px}
.deeper h3{color:#fff;font-size:19px}
.deeper p{margin:2px 0 0;color:#C9D1E3;font-size:15px}
.deeper .btn{background:var(--manila);color:var(--ink)}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--go)}

/* timeline */
.tl{list-style:none;padding:0;margin:0 0 16px 6px;border-left:2px solid var(--ink)}
.tl li{position:relative;padding:4px 0 14px 20px}
.tl li::before{content:"";position:absolute;left:-7px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
.tl .d{font-family:var(--typed);font-weight:700;font-size:14px}

/* questions hub */
.qa{background:var(--sheet);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.qa summary{list-style:none;cursor:pointer;padding:16px 18px;font-family:var(--display);font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:12px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";font-size:24px;line-height:1;color:var(--ink2)}
.qa[open] summary::after{content:"–"}
.qa .body{padding:0 18px 18px}
.qa ul{margin:4px 0 12px;padding-left:20px;color:var(--ink2)}
.qa .law{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink2)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* myth or fact */
.mf{max-width:560px;margin:0 auto;padding:30px 0 60px}
.mfcard{background:#fff;border-radius:18px;box-shadow:0 18px 40px -16px rgba(20,37,74,.35);padding:30px 26px;min-height:240px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);position:relative}
.mfcard .n{font-family:var(--typed);font-size:14px;color:var(--muted);margin-bottom:10px}
.mfcard p.s{font-family:var(--display);font-size:clamp(22px,4vw,28px);line-height:1.2;font-weight:700;margin:0}
.mfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.mfbtns .btn{min-height:64px;font-size:19px}
.mfresult{margin-top:16px;border-radius:14px;padding:16px 18px}
.mfresult.right{background:var(--go-l)} .mfresult.wrong{background:var(--tape-l)}
.mfresult b{font-family:var(--display);font-size:20px;display:block}
.score{font-family:var(--typed);font-weight:700}

/* help, about */
.helpcard{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.helpnum{flex:none;min-width:72px;text-align:center;font-family:var(--display);font-weight:800;color:var(--ink);font-size:19px;background:var(--manila-l);border-radius:9px;padding:8px 6px}
.helpcard h3{font-size:16px}
.grid{display:grid;gap:10px}

/* report */
.report{background:#fff;border:1px solid var(--line);border-radius:6px;padding:34px 32px;box-shadow:0 10px 30px -18px rgba(20,37,74,.3)}
.report h1{font-size:30px}
.report h2{font-size:19px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin-top:28px}
.report table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
.report th,.report td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.report th{background:#F1F2EC}
.report td.lab{font-family:var(--typed);font-weight:700;color:var(--tape);white-space:nowrap}
.report ul{padding-left:20px;margin:6px 0}
.report .instr{background:var(--manila-l);border-left:4px solid var(--tape);padding:12px 14px;font-weight:600;font-size:15px}
.report .meta{font-size:13px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 16px}

/* dialog, toast, footer */
.overlay{position:fixed;inset:0;background:rgba(20,37,74,.5);z-index:60;display:grid;place-items:center;padding:18px}
.dialog{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px}
.langopt{display:flex;justify-content:space-between;align-items:center;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:16px;text-align:left}
.langopt[aria-current="true"]{border-color:var(--ink)}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:14.5px;opacity:0;transition:all .2s;z-index:50;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer.foot{border-top:1px solid var(--line);margin-top:30px;padding:24px 0 120px;font-size:14px;color:var(--muted)}
footer.foot .row{gap:4px 16px}
footer.foot button{background:none;border:0;color:var(--go-d);cursor:pointer;padding:6px 0;text-decoration:underline;font-size:14px}

body.calm .opt:active{transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  header.top,footer.foot,.toolbar,.noprint,.toast,.tray{display:none!important}
  body{background:#fff;font-size:12pt}
  .report{border:0;box-shadow:none;padding:0}
  .report tr,.report li{break-inside:avoid}
}

.opener{background:var(--manila);border-radius:6px 14px 14px 14px;padding:14px 18px 14px 18px;margin:0 0 20px;border-left:6px solid var(--tape)}
.opener .typed{font-family:var(--typed);font-size:14px;color:#5A4A22}
.opener b{font-family:var(--display);font-size:18px}
.opener p{margin:6px 0 0;font-size:15px;color:#4A3C17}
.opener .warn{font-weight:700;color:var(--tape)}
.opener .banner{margin:10px 0 0}
@media (hover:none){.keytip{display:none}}
@media (max-width:860px){.hero>div:first-child .row{display:none}.hero .lead{font-size:16.5px}}
</style>

<noscript><p style="padding:20px">EvidenceReady needs JavaScript to run the questions. For urgent help call 112; for free legal aid call 15100.</p></noscript>
<script>/* EvidenceReady knowledge base — Phase 1 (English).
   Status: DRAFT authored content. Not yet reviewed by a practising advocate.
   Stable IDs only: conditions reference question/option IDs, never display text. */
(function (root) {
  const W = (q, ...v) => ({ q, in: v });            // answer to q is one of v (multi: any overlap)
  const ALL = (...c) => ({ all: c });
  const ANY = (...c) => ({ any: c });
  const NOT = (c) => ({ not: c });
  const ANS = (q) => ({ q, answered: true });
  const o = (pairs) => pairs.map(([id, label]) => ({ id, label }));
  const NS = ['unsure', "I'm not sure"];
  const PN = ['prefer_not', 'Prefer not to say'];

  const KB_VERSION = '2.0.0-draft';
  const REVIEWED = { status: 'draft', label: 'Draft — not yet reviewed by an advocate', date: null };

  /* ---------- Official help directory ---------- */
  const HELP = {
    e112: { label: '112', name: 'Emergency Response (police, fire, ambulance)', detail: 'Call 112 if anyone is in immediate danger.', href: null },
    w181: { label: '181', name: 'Women Helpline', detail: 'Support for women facing violence or threats.', href: null },
    c1098: { label: '1098', name: 'Childline', detail: 'For a child at risk or in need of care.', href: null },
    s14567: { label: '14567', name: 'Elderline (senior citizens)', detail: 'National helpline for older persons.', href: null },
    cy1930: { label: '1930', name: 'National Cyber Crime Helpline', detail: 'Report financial cyber fraud quickly. Online: cybercrime.gov.in', href: 'https://cybercrime.gov.in' },
    l15100: { label: '15100', name: 'NALSA free legal aid helpline', detail: 'Free legal advice and a panel advocate if you are eligible.', href: 'https://nalsa.gov.in' },
    rbi: { label: 'RBI CMS', name: 'RBI Complaint Management System', detail: 'For bank complaints not resolved by the bank (usually after 30 days or an unsatisfactory reply).', href: 'https://cms.rbi.org.in' },
    nch: { label: '1915', name: 'National Consumer Helpline', detail: 'Pre-litigation help for consumer complaints. Online: consumerhelpline.gov.in', href: 'https://consumerhelpline.gov.in' },
    ejag: { label: 'e-Jagriti', name: 'Consumer Commission e-filing', detail: 'Official portal for filing consumer complaints (replaced e-Daakhil from 1 Jan 2025).', href: 'https://e-jagriti.gov.in' },
    ins: { label: 'Bima Bharosa', name: 'IRDAI insurance grievance portal', detail: 'Complain about an insurer after its own grievance cell; then the Insurance Ombudsman.', href: 'https://bimabharosa.irdai.gov.in' },
    cio: { label: 'Ombudsman', name: 'Insurance Ombudsman (Council for Insurance Ombudsmen)', detail: 'Free route for many claim rejections after the insurer replies or 30 days pass.', href: 'https://www.cioins.co.in' },
    rera: { label: 'RERA', name: 'Your state Real Estate Regulatory Authority', detail: 'Complaints against registered real-estate projects and builders. Each state has its own portal.', href: null },
    posh: { label: 'SHe-Box', name: 'SHe-Box (sexual harassment at work)', detail: 'Government portal to register workplace sexual-harassment complaints.', href: 'https://shebox.wcd.gov.in' },
    samadhan: { label: 'SAMADHAN', name: 'Labour dispute portal (Ministry of Labour)', detail: 'Online filing of certain workplace disputes.', href: 'https://samadhan.labour.gov.in' }
  };

  const CATEGORIES = [
    { id: 'money', title: 'Money & banking', blurb: 'Cheques, loans, cards, UPI fraud, frozen accounts', icon: 'bank' },
    { id: 'family', title: 'Family', blurb: 'Divorce, maintenance, custody, violence at home, inheritance', icon: 'family' },
    { id: 'shopping', title: 'Shopping & services', blurb: 'Refunds, defective goods, insurance, builders', icon: 'bag' },
    { id: 'home', title: 'Home & land', blurb: 'Rent, deposits, eviction, encroachment', icon: 'house' },
    { id: 'police', title: 'Police & notices', blurb: 'FIR, arrest, summons, legal notices', icon: 'shield' },
    { id: 'work', title: 'Work', blurb: 'Salary, termination, harassment at work', icon: 'briefcase' },
    { id: 'accidents', title: 'Accidents', blurb: 'Road accidents and injury claims', icon: 'umbrella' },
    { id: 'other', title: 'Online & other', blurb: 'Online harassment, money lent, anything else', icon: 'more' }
  ];


  /* ---------- Shared lawful-collection rules ---------- */
  const LAWFUL = 'Only collect records you are lawfully entitled to. Do not access another person\'s phone, email or accounts without permission.';

  /* =====================================================================
     JOURNEYS
     q fields: id, text, why, type ('single'|'multi'), options, when, deep, chapter, sensitive
     e fields: id, name, fact, why, where, preserve, limit, time, when, holder ('me'|'others')
     ===================================================================== */
  const ISSUES = [];

  /* ---------------- 1. Bank account frozen ---------------- */
  ISSUES.push({
    id: 'bank-account-frozen', cat: 'money', title: 'My bank account has been frozen',
    short: 'Bank account frozen',
    synonyms: ['account frozen', 'account blocked', 'debit freeze', 'lien', 'hold on account', 'cannot withdraw', 'account restricted', 'kyc block', 'cyber police freeze'],
    intro: 'We will work out why the account was restricted, because the records you need depend on the reason.',
    juris: 'Freezes ordered by police, courts or tax authorities follow different procedures. Your advocate will check which authority acted and under what power.',
    questions: [
      { id: 'bf_how', text: 'How did you find out the account was frozen?', why: 'It tells us whether you already have something in writing.',
        options: o([['txn_failed', 'A payment or withdrawal failed'], ['bank_told', 'The bank told me (SMS, email, call or at the branch)'], ['authority', 'Police or another authority contacted me'], NS]) },
      { id: 'bf_reason', text: 'What reason have you been given?', why: 'A KYC block, a police request and a court or tax order each need different records and a different next step.',
        options: o([['kyc', 'KYC / documents not updated'], ['police', 'Police or cyber-crime investigation'], ['suspicious', 'Suspicious or disputed transaction'], ['order', 'Court, tax or other government order'], ['none', 'No reason given'], NS]) },
      { id: 'bf_written', text: 'Do you have any written message or notice about the restriction?', why: 'A written communication usually names who asked for the freeze. That decides who can lift it.',
        options: o([['yes', 'Yes'], ['no', 'No'], NS]) },
      { id: 'bf_scope', text: 'Is the whole account blocked, or only a part of the money?', why: 'Sometimes only a specific amount is held (a "lien"). The rest may remain usable.',
        options: o([['full', 'Whole account blocked'], ['partial', 'Only part of the money is held'], NS]) },
      { id: 'bf_received', text: 'Before the freeze, did you receive money from someone you did not know well?', why: 'Accounts are often frozen because they received part of money that someone else reported as stolen — for example from a buyer, a crypto (P2P) trade, a gaming app or a stranger.',
        when: W('bf_reason', 'police', 'suspicious', 'none', 'unsure'),
        options: o([['yes', 'Yes'], ['no', 'No'], NS]) },
      { id: 'bf_police_contact', text: 'Have the police given you anything?', deep: true, chapter: 'Notices',
        why: 'Police notices often carry a date to appear or respond.',
        when: ANY(W('bf_reason', 'police'), W('bf_how', 'authority')),
        options: o([['notice', 'A written notice or FIR number'], ['called', 'Only a phone call'], ['no', 'Nothing yet'], NS]) },
      { id: 'bf_kyc_attempts', text: 'Have you already submitted your KYC documents again?', deep: true, chapter: 'KYC',
        why: 'If you submitted and the block continued, the acknowledgement matters.',
        when: W('bf_reason', 'kyc'),
        options: o([['submitted', 'Yes, submitted'], ['rejected', 'Tried, but it was refused'], ['no', 'Not yet']]) },
      { id: 'bf_needs', text: 'Do you need this account for any of these?', type: 'multi', deep: true, chapter: 'Impact',
        why: 'Hardship can matter when asking for the freeze to be reduced or lifted.',
        options: o([['salary', 'Receiving salary'], ['business', 'Running a business'], ['medical', 'Medical or urgent family costs'], ['none', 'None of these']]) },
      { id: 'bf_complained', text: 'Have you complained to the bank in writing?', deep: true, chapter: 'Complaints',
        why: 'A written complaint with a reference number creates a record and opens the RBI complaint route if needed.',
        options: o([['yes_ref', 'Yes, I have a reference number'], ['verbal', 'Only spoke to them'], ['no', 'No']]) }
    ],
    evidence: [
      { id: 'bf_e_notice', name: 'The freeze message or notice', fact: 'Who restricted the account and why',
        why: 'It usually names the authority or reason. This decides who can lift the freeze.',
        where: 'SMS, email, net-banking alert, or a letter from the branch.', preserve: 'Keep the original SMS or email. Screenshot it with the date and sender visible.',
        when: W('bf_written', 'yes') },
      { id: 'bf_e_request', name: 'Your written request to the bank asking for the reason', fact: 'Who restricted the account and why',
        why: 'Without a written reason, it is hard to know whether to approach the bank, the police or a court.',
        where: 'Write to your branch or the bank\'s grievance email. Ask: the reason, the authority that asked for the freeze, its reference number, and the amount held.',
        preserve: 'Keep the sent email or a stamped acknowledgement copy.', when: NOT(W('bf_written', 'yes')), action: true },
      { id: 'bf_e_statement', name: 'Account statement from about 6 months before the freeze to today', fact: 'Which transactions triggered the freeze',
        why: 'Your advocate can see the credits that may be linked and the balance that is held.',
        where: 'Net banking (download PDF) or request at the branch.', preserve: 'Download the official PDF. Do not edit it.' },
      { id: 'bf_e_credits', name: 'Details of the specific incoming payments (date, amount, UTR/reference, sender)', fact: 'Whether you received disputed money',
        why: 'Freezes linked to cyber complaints usually point to particular credits.',
        where: 'Your statement and UPI app history.', preserve: 'Note the 12-digit UTR for each payment.', when: W('bf_received', 'yes', 'unsure') },
      { id: 'bf_e_deal', name: 'Proof of the deal behind those payments', fact: 'Whether you received the money in good faith',
        why: 'Invoices, chats with the buyer, or a trading platform order record can show why the money came to you.',
        where: 'Your messages, email, invoices, trading-platform order history.', preserve: 'Export the complete chat, not cropped screenshots.',
        limit: 'Showing a genuine deal does not automatically lift a freeze; the investigating agency or a court decides.', when: W('bf_received', 'yes') },
      { id: 'bf_e_police', name: 'Police notice, FIR number or cyber-complaint reference', fact: 'Which investigation the freeze is linked to',
        why: 'Your advocate needs the case details to approach the police or the court.',
        where: 'From the bank\'s reply, the police notice, or by asking the bank for the requesting agency.', preserve: 'Keep the original notice and the envelope.',
        time: 'A notice may set a date to appear. Show it to an advocate before you respond.', holder: 'others',
        when: ANY(W('bf_reason', 'police'), W('bf_police_contact', 'notice')) },
      { id: 'bf_e_order', name: 'Copy of the court, tax or government order', fact: 'Which authority restricted the account',
        why: 'Orders have their own appeal or review routes and time limits.', where: 'Ask the bank for a copy, or the authority that issued it.',
        preserve: 'Keep the complete order with all pages.', holder: 'others', time: 'Orders can have short challenge periods.', when: W('bf_reason', 'order') },
      { id: 'bf_e_kyc', name: 'The KYC documents you submitted and the bank\'s acknowledgement', fact: 'Whether the KYC requirement was met',
        why: 'Shows you complied with the bank\'s request.', where: 'Your copies; acknowledgement slip or email.', preserve: 'Keep the acknowledgement with its date.',
        when: W('bf_reason', 'kyc') },
      { id: 'bf_e_corr', name: 'All messages and letters with the bank about the freeze', fact: 'What the bank has said and when',
        why: 'Creates a timeline and shows whether the bank responded properly.', where: 'Email, SMS, branch letters, app chat.', preserve: 'Keep them in date order.' },
      { id: 'bf_e_complaint', name: 'Bank complaint reference number and replies', fact: 'Whether the bank\'s complaint process has been used',
        why: 'Usually needed before going to the RBI complaint system.', where: 'Bank email or app.', preserve: 'Note the date of filing.',
        when: W('bf_complained', 'yes_ref') },
      { id: 'bf_e_need', name: 'Proof that you depend on the account (salary slips, business invoices, medical bills)', fact: 'Hardship caused by the freeze',
        why: 'Can support a request to release part of the money.', where: 'Employer, your business records, hospital.', preserve: 'Keep originals.',
        when: W('bf_needs', 'salary', 'business', 'medical') },
      { id: 'bf_e_owner', name: 'Proof that you own the account (passbook, account opening papers, ID)', fact: 'You are the account holder',
        why: 'Basic identification for any application.', where: 'Your records or the branch.', preserve: '' }
    ],
    urgent: [
      { id: 'bf_u_police', when: W('bf_police_contact', 'notice'), level: 'soon', title: 'Speak to an advocate before replying to a police notice',
        text: 'A notice may require you to appear or produce documents by a date. Get advice before you go or respond.', help: ['l15100'] },
      { id: 'bf_u_medical', when: W('bf_needs', 'medical'), level: 'soon', title: 'Urgent medical need',
        text: 'If you need the money for treatment, tell an advocate now. It may be possible to ask for part of the money to be released.', help: ['l15100'] }
    ],
    lawyerQs: [
      { text: 'Which authority asked for the freeze, and under what power?' },
      { text: 'Is the whole balance frozen, or only the disputed amount — and can the rest be released?' },
      { text: 'Should we approach the bank, the investigating agency, or a court?', when: W('bf_reason', 'police', 'suspicious', 'order') },
      { text: 'Do I need to respond to the police notice, and how?', when: W('bf_police_contact', 'notice') }
    ]
  });

  /* ---------------- 2. UPI / cyber fraud ---------------- */
  ISSUES.push({
    id: 'upi-cyber-fraud', cat: 'money', title: 'I was cheated online or money left my account without permission',
    short: 'UPI or online fraud',
    synonyms: ['upi fraud', 'upi scam', 'cyber fraud', 'online fraud', 'otp fraud', 'scam', 'unauthorised transaction', 'unauthorized debit', 'hacked', 'phishing', 'card fraud', 'credit card fraud', 'debit card fraud', 'investment fraud', 'task scam'],
    intro: 'Speed matters with online fraud. We will ask what happened and make sure you have reported it, then list your records.',
    juris: 'Your bank\'s liability depends on how quickly you reported and whether the bank or you were at fault. RBI\'s revised rules apply to transactions from 1 January 2027; older ones follow the 2017 framework.',
    questions: [
      { id: 'uf_when', text: 'When did the money leave your account?', why: 'The first hours matter most. Fast reports improve the chance of money being put on hold.',
        options: o([['today', 'Within the last 24 hours'], ['3days', '1 to 3 days ago'], ['month', 'Within the last month'], ['older', 'More than a month ago']]) },
      { id: 'uf_how', text: 'Which best describes what happened?', why: 'Being tricked into paying is treated differently from money taken without your action.',
        options: o([['tricked', 'I was tricked into sending money (fake seller, job, investment, etc.)'], ['unauth', 'Money left without me doing anything'], ['otp', 'I shared an OTP, PIN or card details'], ['remote', 'Someone made me install an app or share my screen'], NS]) },
      { id: 'uf_reported', text: 'Where have you reported it so far?', type: 'multi', why: 'Each report creates a reference number your advocate will ask for.',
        options: o([['h1930', '1930 helpline or cybercrime.gov.in'], ['bank', 'My bank'], ['police', 'Police station'], ['none', 'Nowhere yet']]) },
      { id: 'uf_mode', text: 'How did the money go?', why: 'Card, UPI and net-banking leave different records.',
        options: o([['upi', 'UPI'], ['card', 'Debit or credit card'], ['netbanking', 'Net banking / IMPS / NEFT'], ['wallet', 'Wallet'], ['multiple', 'More than one way']]) },
      { id: 'uf_contact', text: 'Do you still have the messages, call log, links or app the scammer used?', deep: true, chapter: 'Scammer details',
        why: 'These help trace the people involved.', options: o([['yes', 'Yes, all of it'], ['partly', 'Some of it'], ['deleted', 'Deleted or lost']]) },
      { id: 'uf_beneficiary', text: 'Do you know where the money went (UPI ID, account number or phone)?', deep: true, chapter: 'Scammer details',
        why: 'Receiving account details let the police and banks act on that account.', options: o([['yes', 'Yes'], ['no', 'No']]) },
      { id: 'uf_device', text: 'Is the app the scammer asked you to install still on your phone?', deep: true, chapter: 'Your phone',
        why: 'Its name and installation details may matter to the investigation.', when: W('uf_how', 'remote'),
        options: o([['yes', 'Yes'], ['removed', 'Already removed'], NS]) },
      { id: 'uf_bankresp', text: 'What has the bank said?', deep: true, chapter: 'Bank response', when: W('uf_reported', 'bank'),
        why: 'A rejection or no reply opens the RBI complaint route.', options: o([['refunded', 'Refunded (fully or partly)'], ['rejected', 'Rejected my claim'], ['pending', 'Still pending'], ['silent', 'No reply']]) }
    ],
    evidence: [
      { id: 'uf_e_report', name: 'Report at 1930 / cybercrime.gov.in and keep the acknowledgement number', fact: 'The fraud was reported promptly',
        why: 'An official report can lead to the receiving account being put on hold.', where: 'Call 1930 or file at cybercrime.gov.in.',
        preserve: 'Save the acknowledgement number.', time: 'Report as quickly as possible.', action: true, when: NOT(W('uf_reported', 'h1930')) },
      { id: 'uf_e_ack', name: '1930 / cybercrime.gov.in acknowledgement number', fact: 'The fraud was reported promptly',
        why: 'Your advocate and the police will use it to track the complaint.', where: 'SMS or email after reporting.', preserve: 'Screenshot with date.',
        when: W('uf_reported', 'h1930') },
      { id: 'uf_e_txn', name: 'Transaction records for every payment (date, time, amount, UTR/reference)', fact: 'How much went, when, and where',
        why: 'The 12-digit UTR or reference is the key to tracing each payment.', where: 'UPI app history, bank statement, card statement.',
        preserve: 'Download the official statement PDF; note each reference.' },
      { id: 'uf_e_alerts', name: 'Bank SMS and email alerts for those payments', fact: 'When you were told about each debit',
        why: 'Alert times help show when you first knew.', where: 'Your phone and email.', preserve: 'Do not delete the SMS. Screenshot with the sender visible.' },
      { id: 'uf_e_bank', name: 'Your written complaint to the bank and its reference number', fact: 'You notified the bank, and when',
        why: 'For money taken without your action, the time you informed the bank can affect whether you bear any loss.',
        where: 'Bank app, email, branch.', preserve: 'Note the date and time you reported.',
        time: 'Tell the bank in writing today. Under RBI rules in force until 31 Dec 2026, reporting an unauthorised debit within 3 working days gives the most protection. From 1 Jan 2027 the window becomes 5 calendar days, and also covers payments you were tricked into making.',
        when: ANY(W('uf_how', 'unauth', 'otp', 'remote', 'unsure'), W('uf_reported', 'bank')) },
      { id: 'uf_e_chats', name: 'The complete conversation with the scammer (chat, call log, emails, links)', fact: 'How you were deceived',
        why: 'Shows what was promised or claimed, and who was involved.', where: 'WhatsApp, Telegram, SMS, email, call log.',
        preserve: 'Export the whole chat; do not crop. Do not reply or delete anything. Note phone numbers and profile names.',
        limit: 'Screenshots can be questioned; keep the phone and original files too.', when: NOT(W('uf_contact', 'deleted')) },
      { id: 'uf_e_lost', name: 'Anything left about the scammer (numbers, names, website, payment request)', fact: 'Who was involved',
        why: 'Even partial details help.', where: 'Call log, browser history, bank statement payee names.', preserve: 'Write down what you remember now, with dates.',
        when: W('uf_contact', 'deleted') },
      { id: 'uf_e_benef', name: 'Receiving UPI ID, account number or phone number', fact: 'Where the money went', why: 'Lets the police and banks act on the receiving account.',
        where: 'Transaction details in your UPI app or statement.', preserve: '', when: W('uf_beneficiary', 'yes') },
      { id: 'uf_e_app', name: 'Name of the app you were asked to install, with screenshots', fact: 'How access to your phone was obtained',
        why: 'Helps the investigation and your bank claim.', where: 'Your phone\'s app list.', preserve: 'Note the app name before removing it. Ask the police before resetting the phone.',
        when: W('uf_how', 'remote') },
      { id: 'uf_e_fir', name: 'Police complaint or FIR copy', fact: 'A criminal complaint exists', why: 'Often needed for bank claims and recovery.',
        where: 'Police station or the cyber cell.', preserve: 'Keep the stamped copy.', holder: 'others', when: W('uf_reported', 'police') },
      { id: 'uf_e_bankreply', name: 'The bank\'s reply (refund, rejection or none)', fact: 'How the bank handled your claim',
        why: 'Needed to escalate to the RBI complaint system.', where: 'Email or letter from bank.', preserve: '', when: W('uf_bankresp', 'rejected', 'silent', 'pending', 'refunded') },
      { id: 'uf_e_offer', name: 'The fake ad, job offer, website or investment page', fact: 'What you were promised',
        why: 'Shows the deception.', where: 'Screenshots, browser history.', preserve: 'Save the web address and screenshots with dates.', when: W('uf_how', 'tricked') }
    ],
    urgent: [
      { id: 'uf_u_report', level: 'now', when: ALL(W('uf_when', 'today', '3days'), ANS('uf_reported'), NOT(W('uf_reported', 'h1930'))),
        title: 'Report this now — before finishing the list',
        text: 'Call 1930 or report at cybercrime.gov.in, and tell your bank in writing. Faster reports improve the chance money can be put on hold.', help: ['cy1930'] },
      { id: 'uf_u_bank', level: 'soon', when: ALL(W('uf_how', 'unauth', 'otp', 'remote'), ANS('uf_reported'), NOT(W('uf_reported', 'bank'))),
        title: 'Tell your bank in writing today', text: 'For money taken without your action, the time you report to the bank can affect how much of the loss you bear.', help: ['rbi'] }

  Q('family', 'mutual-divorce-time', 'How long does a mutual consent divorce take?',
    'Under the Hindu Marriage Act, a couple must usually have lived separately for at least a year before filing jointly. After the first motion there is a six-month waiting period before the final decree, which courts can waive in suitable cases. In practice many cases finish in 6 to 18 months.',
    ['Which law your marriage falls under', 'Whether all terms (money, children, belongings) are agreed', 'Whether the court agrees to waive the waiting period'],
    'Hindu Marriage Act s.13B; Special Marriage Act s.28; Amardeep Singh v. Harveen Kaur (2017)', 'divorce-separation', ['mutual divorce', 'divorce time', 'cooling period']);
  Q('family', 'divorce-grounds', 'On what grounds can I file for divorce without my spouse\'s consent?',
    'Common grounds include cruelty, desertion for two years, adultery, conversion, serious mental disorder and not being heard of for seven years. The exact grounds depend on the personal law or the Special Marriage Act that applies. Cruelty includes serious mental cruelty, not only physical violence.',
    ['Personal law that governs your marriage', 'The evidence available for the ground', 'How long you have been separated'], 'Hindu Marriage Act s.13; Special Marriage Act s.27; Divorce Act 1869', 'divorce-separation', ['contested divorce', 'grounds of divorce', 'cruelty']);
  Q('family', 'wife-maintenance', 'Can a wife claim maintenance, and how much?',
    'Yes. A wife, children and parents who cannot maintain themselves can claim maintenance, including during a divorce case. Courts consider both sides\' income, needs and lifestyle; both parties usually file a sworn affidavit of income and assets. There is no fixed percentage.',
    ['Both spouses\' income and assets', 'Children\'s needs', 'Which law and forum the claim is filed under'], 'BNSS s.144 (formerly CrPC 125); Hindu Adoptions & Maintenance Act; DV Act; Rajnesh v. Neha (2020)', 'maintenance', ['alimony', 'maintenance amount', 'interim maintenance']);
  Q('family', 'husband-maintenance', 'Can a husband claim maintenance from his wife?',
    'Under the Hindu Marriage Act, either spouse can seek maintenance during and after divorce proceedings if they lack independent income. Under the general BNSS provision, only a wife (not a husband) can claim from a spouse.',
    ['Which law the case is under', 'Each spouse\'s earning capacity'], 'Hindu Marriage Act ss.24–25; BNSS s.144', 'maintenance', ['husband alimony']);
  Q('family', 'custody-mother', 'Does the mother always get custody of the child?',
    'Not always. The child\'s welfare is the paramount consideration. Under Hindu law, custody of a child under five is ordinarily with the mother, but courts can decide differently. The other parent usually gets visiting rights.',

    'Yes, for Hindu families. Since the 2005 amendment, a daughter is a coparcener in ancestral (joint family) property by birth, with the same rights as a son, whether married or not. She also inherits her father\'s self-acquired property equally with other Class I heirs if he died without a will.',
    ['Whether the property is ancestral or self-acquired', 'Whether there is a valid will', 'Whether a partition was completed before 20 Dec 2004'], 'Hindu Succession Act s.6 (2005 amendment); Vineeta Sharma v. Rakesh Sharma (2020)', 'inheritance-partition', ['daughter right', 'sister share', 'father property']);
  Q('family', 'succession-vs-heir', 'What is the difference between a succession certificate and a legal heir certificate?',
    'A succession certificate is issued by a civil court and is mainly used to collect debts and securities of a deceased person — like bank deposits and shares. A legal heir certificate is issued by the state revenue authority and identifies the heirs for purposes such as pensions, utilities and mutation.',

<script>/* EvidenceReady deterministic interview engine. Pure functions; no DOM. */
(function (root) {
  function asArr(v) { return v == null ? [] : Array.isArray(v) ? v : [v]; }

  function evalWhen(cond, answers) {
    if (!cond) return true;
    if (cond.all) return cond.all.every((c) => evalWhen(c, answers));
    if (cond.any) return cond.any.some((c) => evalWhen(c, answers));
    if (cond.not) return !evalWhen(cond.not, answers);
    if (cond.q) {
      const a = answers[cond.q];
      if (cond.answered) return a != null;
      if (a == null) return false;
      const vals = asArr(a);
      return cond.in.some((v) => vals.includes(v));
    }
    throw new Error('Bad condition ' + JSON.stringify(cond));
  }

  function applicable(q, answers) { return evalWhen(q.when, answers); }

  /* Remove answers to questions that no longer apply (repeat until stable). Returns removed ids. */
  function prune(issue, answers) {
    const removed = [];
    let changed = true;
    while (changed) {
      changed = false;
      for (const q of issue.questions) {
        if (answers[q.id] != null && !applicable(q, answers)) { delete answers[q.id]; removed.push(q.id); changed = true; }
      }
    }
    return removed;
  }

  function stageQuestions(issue, answers, stage) {
    return issue.questions.filter((q) => (stage === 'deep' ? !!q.deep : !q.deep) && applicable(q, answers));
  }

  function nextQuestion(issue, answers, stage, skipped) {
    skipped = skipped || {};
    return stageQuestions(issue, answers, stage).find((q) => answers[q.id] == null && !skipped[q.id]) || null;
  }

  function progress(issue, answers, stage, skipped) {
    const qs = stageQuestions(issue, answers, stage);
    const done = qs.filter((q) => answers[q.id] != null || (skipped && skipped[q.id])).length;
    return { done, total: qs.length };
  }

  function evidence(issue, answers) { return issue.evidence.filter((e) => evalWhen(e.when, answers)); }
  function urgent(issue, answers) { return (issue.urgent || []).filter((u) => evalWhen(u.when, answers)); }
  function info(issue, answers) { return (issue.info || []).filter((i) => evalWhen(i.when, answers)); }
  function lawyerQs(issue, answers) { return (issue.lawyerQs || []).filter((l) => evalWhen(l.when, answers)); }
  function hasDeep(issue, answers) { return stageQuestions(issue, answers, 'deep').length > 0; }

  /* Collect every question/option ID referenced by conditions (for validation). */
  function refs(cond, out) {
    if (!cond) return out;
    if (cond.all) cond.all.forEach((c) => refs(c, out));
    else if (cond.any) cond.any.forEach((c) => refs(c, out));
    else if (cond.not) refs(cond.not, out);
    else if (cond.q) out.push(cond);
    return out;
  }

  const ER_ENGINE = { evalWhen, applicable, prune, stageQuestions, nextQuestion, progress, evidence, urgent, info, lawyerQs, hasDeep, refs };
  root.ER_ENGINE = ER_ENGINE;
})(globalThis);
</script>

  function persist() { if (!saveOn) return; try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* unavailable */ } }
  function loadSaved() { try { const v = localStorage.getItem(STORE_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function clearSaved() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } }
  const issue = () => BY_ID[S.issueId];

  let downloads = null;
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then((d) => { downloads = d; if (location.hash === '#report') render(); }).catch(() => {}); } catch (e) { /* none */ }

  /* ---------- routing ---------- */
  function go(v) { if (location.hash === '#' + v) render(); else location.hash = v; }
  window.addEventListener('hashchange', render);

  function shell(inner, opt = {}) {
    const sensitive = !!(issue() && issue().sensitive && opt.inJourney);
    document.body.classList.toggle('calm', sensitive);
    return `<header class="top"><div class="wrap">
        <button class="brand" data-go="home" aria-label="EvidenceReady home">${LOGO}<span>EvidenceReady</span></button>
        <button class="nav" data-go="questions">${ic('q', 18)}<span class="lbl-long">Legal questions</span><span class="lbl-short">Ask</span></button>
        <button class="nav" data-go="help">${ic('phone', 18)}<span class="lbl-long">Urgent help</span><span class="lbl-short">Help</span></button>
        <button class="nav lang" data-act="lang" aria-label="Language: English. Change language">${ic('globe', 18)}<span class="lbl-long">English</span><span class="lbl-short">EN</span></button>
        ${sensitive ? `<a class="nav exit" data-act="exit" href="https://www.google.com" target="_blank" rel="noopener noreferrer" title="Clears this page and opens a neutral website">${ic('x', 18)}<span>Exit</span></a>` : ''}
      </div></header>
      <main id="main" tabindex="-1">${inner}</main>
      ${opt.tray ? trayHTML() : ''}
      ${opt.noFooter ? '' : footer()}`;
  }
  function footer() {
    return `<footer class="foot"><div class="wrap">
      <p><span class="tag draft">${esc(KB.reviewed.label)}</span></p>
      <p style="max-width:62em">EvidenceReady helps you prepare for a meeting with an advocate. It is not legal advice, does not replace an advocate, and cannot tell you whether a court will accept any document. Content v${esc(KB.version)}.</p>
      <div class="row"><button data-go="about">How this works &amp; privacy</button><button data-go="advocates">For advocates</button><button data-go="myths">Myth or fact</button><button data-go="help">Legal aid &amp; urgent help</button>${S.issueId ? '<button data-act="clear">Clear my answers</button>' : ''}</div>
    </div></footer>`;
  }

  function render() {
    const raw = (location.hash || '').slice(1);
    if (raw.startsWith('a-')) { applyAdvLink(raw); return; }
    const [view, ...rest] = raw.split('-'); const arg = rest.join('-');
    const need = (fn) => (S.issueId ? fn() : viewHome());
    const map = {
      cat: () => { UI.club = CAT[arg] ? arg : UI.club; return viewHome(true); },
      start: () => viewIntro(arg), topic: () => viewIntro('general', KB.directory[Number(arg)]),
      quiz: () => need(viewQuiz), brk: () => need(viewBreak), urgent: () => need(viewUrgent), list: () => need(viewList),
      answers: () => need(viewAnswers), timeline: () => need(viewTimeline), report: () => need(viewReport),
      questions: () => viewQuestions(), q: () => viewQuestions(arg), myths: () => viewMyths(), advocates: () => viewAdvocates(), help: () => viewHelp(), about: () => viewAbout()
    };
    app.innerHTML = (map[view] || (() => viewHome()))();
    const h = app.querySelector('h1');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    if (view === 'cat') document.getElementById('shelf')?.scrollIntoView();
    else if (view === 'q') document.getElementById('qa-' + arg)?.scrollIntoView();
    else window.scrollTo(0, 0);
    afterRender(view);
  }

  /* ============ HOME ============ */
  const SUGGEST = ['My cheque bounced', 'UPI fraud', 'Divorce', 'NRI property', 'Client not paying', 'Landlord kept my deposit'];
  function clubRows(cid) {
    const deep = BUILT.filter((i) => i.cat === cid);
    const gen = KB.directory.map((d, idx) => ({ ...d, idx })).filter((d) => d.cat === cid);
    return deep.map((i) => `<button class="issue" data-play="${i.id}"><b>${esc(i.short)}</b><span>${esc(i.title)}</span><em>Guided, up to ${i.evidence.length} records</em></button>`).join('')
      + gen.map((d) => `<button class="issue gen" data-play="general" data-topic="${d.idx}"><b>${esc(d.title)}</b><span>General preparation for now</span><em>general</em></button>`).join('');
  }
  function viewHome() {
    const saved = !S.issueId && loadSaved();
    const topQs = ['cheque-bounce-steps', 'mutual-divorce-time', 'upi-fraud-first', 'daughter-share', 'fir-refused', 'consumer-complaint', 'anticipatory-bail', 'rent-11-months'].map((id) => KB.questions.find((q) => q.id === id)).filter(Boolean);
    const sample = KB.myths.slice(0, 3);
    return shell(`<div class="wrap">
      ${saved && saved.issueId ? `<div class="banner info" style="margin-top:18px">${ic('folder')}<div><h3>Your saved file is on this device</h3><p>${esc((BY_ID[saved.issueId] || {}).short || '')}. <button class="btn text" data-act="resume">Open it</button> <button class="btn text" data-act="forget">Delete it</button></p></div></div>` : ''}
      <section class="hero">
        <div>
          <h1>Going to a lawyer? Know what to bring.</h1>
          <p class="lead">Tell us what happened in a few taps. We'll build your case file: the records to collect, where to find them, the dates that matter, and the questions to ask.</p>
          <div class="row" style="margin-top:22px"><button class="btn go" data-act="toshelf">Pick your problem</button><button class="btn line" data-go="questions">I just have a legal question</button></div>
        </div>
        <div class="cover" role="search">
          <span class="tape" aria-hidden="true"></span>
          <label for="matter">In the matter of:</label>
          <input id="matter" class="matter" type="search" autocomplete="off" placeholder="describe it in your words…" aria-describedby="mhint">
          <span id="mhint" class="sr">Matching problems appear below as you type</span>
          <div id="results" class="results" aria-live="polite"></div>
          <div class="suggest" id="suggest">${SUGGEST.map((x) => `<button class="slipchip" data-ex="${esc(x)}">${esc(x)}</button>`).join('')}</div>
          <div class="foot"><span>${ic('check', 15)} Free</span><span>${ic('check', 15)} No sign-up</span><span>${ic('lock', 15)} Nothing is uploaded</span></div>
        </div>
      </section>
      <section class="shelf" id="shelf" aria-labelledby="shelfh">
        <h2 id="shelfh">Or pick from the shelf</h2>
        <p class="muted" style="margin:0">${BUILT.length} guided problems, chosen from the disputes that most often reach Indian courts, consumer helplines and the RBI Ombudsman.</p>
        <div class="tabs" role="tablist" aria-label="Problem areas">${KB.categories.map((c) => `<button class="tab" role="tab" id="tab-${c.id}" aria-controls="drawer" aria-selected="${UI.club === c.id}" data-club="${c.id}">${ic(c.icon, 17)} ${esc(c.title)}</button>`).join('')}</div>
        <div class="drawer" id="drawer" role="tabpanel" aria-labelledby="tab-${UI.club}">${clubRows(UI.club)}
          <button class="issue gen" data-play="general"><b>Something else, or not sure</b><span>Answer a few general questions</span><em>general</em></button></div>
      </section>
      <section class="split">
        <div>
          <h2>Questions people ask most</h2>
          <ul class="qlist">${topQs.map((q) => `<li><button data-go="q-${q.id}">${esc(q.q)}</button></li>`).join('')}</ul>
          <p style="margin-top:12px"><button class="btn text" data-go="questions">See all ${KB.questions.length} questions</button></p>
        </div>
        <div class="game">
          <h2>Myth or fact?</h2>
          <p>${KB.myths.length} quick cards on rights people often get wrong. Takes two minutes.</p>
          <div class="deck" aria-hidden="true">${sample.map((m) => `<div>${esc(m.s)}</div>`).join('')}</div>
          <button class="btn go" data-go="myths">Play</button>
        </div>
      </section>

    </div>`);
  }
  function searchAll(q) {
    const stop = ['the', 'and', 'has', 'have', 'been', 'not', 'was', 'with', 'from', 'that', 'this', 'someone', 'what', 'about', 'my', 'me', 'is', 'are', 'did', 'got', 'for'];
    const words = q.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter((w) => w.length > 2 && !stop.includes(w));
    if (!words.length) return [];
    const ql = q.toLowerCase();
    const score = (t, syn) => { const hay = (t + ' | ' + syn.join(' | ')).toLowerCase(); let s = 0; words.forEach((w) => { if (hay.includes(w)) s += 2; else if (w.length > 4 && hay.includes(w.slice(0, -1))) s += 1; }); syn.forEach((x) => { if (ql.includes(x)) s += 4; }); return s; };
    const res = [];
    BUILT.forEach((i) => { const s = score(i.title + ' ' + i.short, i.synonyms); if (s) res.push({ s: s + 1, play: i.id, title: i.short, kind: 'Guided' }); });
    KB.directory.forEach((d, idx) => { const s = score(d.title, d.synonyms); if (s) res.push({ s, play: 'general', topic: idx, title: d.title, kind: 'General' }); });
    KB.questions.forEach((x) => { const s = score(x.q, x.kw); if (s > 2) res.push({ s: s - 1, go: 'q-' + x.id, title: x.q, kind: 'Answer' }); });
    return res.sort((a, b) => b.s - a.s).slice(0, 6);
  }
  function renderResults(q) {
    const box = document.getElementById('results'); if (!box) return;
    document.getElementById('suggest').hidden = !!q.trim();
    if (!q.trim()) { box.innerHTML = ''; return; }
    const r = searchAll(q);
    box.innerHTML = r.length ? r.map((x) => `<button class="res" ${x.play ? `data-play="${x.play}" ${x.topic != null ? `data-topic="${x.topic}"` : ''}` : `data-go="${x.go}"`}><span>${esc(x.title)}</span><small>${x.kind}</small></button>`).join('')
      : `<button class="res" data-play="general"><span>Not sure what this is? Use general preparation</span><small>General</small></button>`;
  }

  /* ============ INTRO ============ */
  function startIssue(id, topic) { const keep = S.adv && S.adv.issueId === id ? S.adv : null; S = blank(); S.issueId = id; S.topic = topic || null; S.adv = keep; persist(); }
  function viewIntro(id, topic) {
    const iss = BY_ID[id]; if (!iss) return viewHome();
    const qs = E.stageQuestions(iss, {}, 'quick');
    const chaps = [...new Set(iss.questions.map(chapOf))];
    const adv = S.adv && S.adv.issueId === id ? S.adv : null;
    return shell(`<div class="wrap narrow"><section style="padding:20px 0 40px">
      <button class="btn text" data-go="${topic ? 'cat-' + topic.cat : 'cat-' + iss.cat}">${ic('back', 18)} Back to the shelf</button>
      ${adv ? advBanner(adv) : ''}
      <div class="filehead"><span class="tape" aria-hidden="true"></span><p class="typed">In the matter of:</p><h1>${esc(topic ? topic.title : iss.short)}</h1></div>
      ${topic && topic.urgentNote ? `<div class="banner soon">${ic('alert')}<div><h3>Before you start</h3><p>${esc(topic.urgentNote)}</p></div></div>` : ''}
      <p class="lead">${esc(iss.intro)}</p>
      <div class="panel">
        <h3>${chaps.length} chapters, about ${qs.length} quick questions to start</h3>
        <p class="muted small" style="margin:6px 0 0">${chaps.map(esc).join(' → ')}</p>
        <p class="small" style="margin:10px 0 0">Your first list appears after the quick round. You can go deeper after that, or stop.</p>
      </div>
      <p class="small muted" style="margin-top:14px"><span class="tag draft">${esc(KB.reviewed.label)}</span> ${esc(iss.juris)}</p>
      <div class="row" style="margin-top:18px"><button class="btn go" data-act="begin" data-id="${iss.id}" ${topic ? `data-topic="${KB.directory.indexOf(topic)}"` : ''}>Open my file</button><span class="small muted">${ic('lock', 14)} Skip any question. Stop any time.</span></div>
    </section></div>`);
  }
  function advBanner(adv) {
    return `<div class="banner adv">${ic('user')}<div><h3>${adv.name ? esc(adv.name) + ' asked you to prepare' : 'Your advocate asked you to prepare'}</h3>${adv.note ? `<p>“${esc(adv.note)}”</p>` : ''}${adv.must && adv.must.length ? '<p class="small">Records they want are marked <span class="tag adv">Advocate asked</span>.</p>' : ''}</div></div>`;
  }

  /* ============ QUIZ ============ */
  const currentQ = () => E.nextQuestion(issue(), S.answers, S.stage, S.skipped);
  function chaptersFor(stage, cur) {
    const iss = issue(); const qs = E.stageQuestions(iss, S.answers, stage);
    const names = [...new Set(qs.map(chapOf))];
    return names.map((n) => { const inC = qs.filter((q) => chapOf(q) === n); const done = inC.every((q) => S.answers[q.id] != null || S.skipped[q.id]); return { n, done, now: cur && chapOf(cur) === n }; });
  }
  function trayHTML() {
    const n = E.evidence(issue(), S.answers).length;
    return `<div class="tray noprint"><div class="wrap"><div class="trayin" id="tray"><span class="count" id="traycount">${n}</span><span class="lbl">records in<br>your file</span><button class="btn" data-act="showlist">Open file</button></div></div></div>`;
  }
  function viewQuiz() {
    const iss = issue(); const q = currentQ();
    if (!q) { finishStage(); return viewList(); }
    const pr = E.progress(iss, S.answers, S.stage, S.skipped);
    const multi = q.type === 'multi';
    const cur = S.answers[q.id] != null ? S.answers[q.id] : (S.prefill || {})[q.id];
    const urg = E.urgent(iss, S.answers).filter((u) => u.level !== 'info');
    return shell(`<div class="wrap narrow qwrap">
      <nav class="chapters" aria-label="Chapters">${chaptersFor(S.stage, q).map((c) => `<span class="chap ${c.now ? 'now' : c.done ? 'done' : ''}" ${c.now ? 'aria-current="step"' : ''}>${c.done && !c.now ? ic('check', 14) : ''}${esc(c.n)}</span>`).join('')}</nav>
      ${S.stage === 'quick' && pr.done === 0 ? `<div class="opener"><span class="typed">In the matter of:</span> <b>${esc(S.topic ? S.topic.title : iss.short)}</b><p>${esc(iss.intro)}</p>${S.topic && S.topic.urgentNote ? `<p class="warn">${esc(S.topic.urgentNote)}</p>` : ''}${S.adv && S.adv.issueId === iss.id ? advBanner(S.adv) : ''}</div>` : ''}
      ${urg.map(urgentBanner).join('')}
      <div class="qmeta"><span>${S.stage === 'quick' ? 'Quick round' : 'Going deeper'}</span><span>${pr.done + 1} of about ${pr.total}</span></div>
      <form id="qform" data-q="${q.id}">
        <fieldset><legend><h1 class="qtext">${esc(q.text)}</h1></legend>
          ${multi ? '<p class="muted small" style="margin:8px 0 0">Choose all that apply, then continue.</p>' : ''}
          <div class="opts">${q.options.map((o, i) => { const ch = multi ? (cur || []).includes(o.id) : cur === o.id;
            return `<label class="opt"><input type="${multi ? 'checkbox' : 'radio'}" name="a" value="${o.id}" ${ch ? 'checked' : ''}><span class="key" aria-hidden="true">${KEYS[i]}</span><span>${esc(o.label)}</span></label>`; }).join('')}</div>
        </fieldset>
        <p class="why"><b>Why we ask:</b> ${esc(q.why)}</p>
        <div class="qfoot"><div class="row"><button type="button" class="btn line" data-act="qback" ${S.history.length ? '' : 'disabled'}>${ic('back', 18)} Back</button><button type="button" class="btn text" data-act="skip">Skip</button></div>
          <button type="submit" class="btn go" id="nextbtn" ${multi ? '' : 'hidden'}>Continue</button></div>
      </form>
      <p class="small muted keytip" style="margin-top:14px">Tip: press ${KEYS.slice(0, q.options.length).split('').join(', ')} to answer.</p>
    </div>`, { tray: true, inJourney: true });
  }
  function urgentBanner(u) {
    const help = (u.help || []).map((h) => KB.help[h]).filter(Boolean);
    return `<div class="banner ${u.level}" role="${u.level === 'now' ? 'alert' : 'note'}">${ic(u.level === 'info' ? 'info' : 'alert')}<div><h3>${esc(u.title)}</h3><p>${esc(u.text)}</p>${help.length ? `<p class="small" style="margin-top:6px">${help.map((h) => `<b>${esc(h.label)}</b> ${esc(h.name)}`).join(' | ')}</p>` : ''}</div></div>`;
  }
  function answer(q, val) {
    const iss = issue();
    const beforeEv = new Set(E.evidence(iss, S.answers).map((e) => e.id));
    const beforeUrg = new Set(E.urgent(iss, S.answers).map((u) => u.id));
    S.history.push({ id: q.id, stage: S.stage });
    S.answers[q.id] = val; delete S.skipped[q.id];
    E.prune(iss, S.answers).forEach((id) => { S.history = S.history.filter((h) => h.id !== id); });
    const added = E.evidence(iss, S.answers).filter((e) => !beforeEv.has(e.id));
    S.chapterFound = [...new Set([...(S.chapterFound || []), ...added.map((e) => e.id)])];
    persist();
    const newNow = E.urgent(iss, S.answers).find((u) => u.level === 'now' && !beforeUrg.has(u.id) && !S.ackUrgent[u.id]);
    if (newNow) { S.pendingUrgent = newNow.id; go('urgent'); return; }
    S._fly = added.map((e) => e.name);
    nextAfter(q);
  }
  function nextAfter(q) {
    const nq = currentQ();
    if (!nq) { S._fly = null; finishStage(); go('brk'); return; }
    if (q && chapOf(nq) !== chapOf(q)) {
      const chapQs = issue().questions.filter((x) => chapOf(x) === chapOf(q) && (S.answers[x.id] != null || S.skipped[x.id]));
      if ((S.chapterFound || []).length) { S._fly = null; S.breakChapter = chapOf(q); go('brk'); return; }
    }
    render();
  }
  function finishStage() { if (S.stage === 'quick') S.quickDone = true; else S.deepDone = true; S.breakChapter = S.breakChapter || null; persist(); }

  /* chapter break / end of round */
  function viewBreak() {
    const iss = issue(); const nq = currentQ();
    const found = (S.chapterFound || []).map((id) => iss.evidence.find((e) => e.id === id)).filter(Boolean);
    const tips = iss.tips || [];
    const tip = tips.length ? tips[(S.breaks || 0) % tips.length] : null;
    const title = nq ? `Chapter done: ${S.breakChapter || ''}` : (S.stage === 'quick' ? 'Quick round done' : 'All questions done');
    return shell(`<div class="wrap narrow break">
      ${iss.sensitive ? '' : '<span class="stamp">Filed</span>'}
      <h1 style="font-size:clamp(28px,5vw,44px)">${esc(title)}</h1>
      ${found.length ? `<p class="lead">${found.length === 1 ? 'One new record' : found.length + ' new records'} went into your file.</p><div class="found">${found.map((e) => `<div class="slip">${esc(e.name)}</div>`).join('')}</div>` : '<p class="lead">Nothing new this chapter — that\'s normal.</p>'}
      ${tip ? `<div class="tip"><b>Good to know</b>${esc(tip)}</div>` : ''}
      <div class="row">${nq ? `<button class="btn go" data-act="continue">Next chapter: ${esc(chapOf(nq))}</button><button class="btn line" data-act="showlist">Open my file</button>`
        : `<button class="btn go" data-act="showlist">Open my file</button>`}</div>
    </div>`, { tray: !!nq, inJourney: true });
  }

  function viewUrgent() {
    const iss = issue(); const u = (iss.urgent || []).find((x) => x.id === S.pendingUrgent);
    if (!u) return viewQuiz();
    const help = (u.help || []).map((h) => KB.help[h]).filter(Boolean);
    return shell(`<div class="wrap narrow" style="padding:26px 0 60px">
      <div class="banner now" role="alert">${ic('alert', 24)}<div><h1 style="font-size:clamp(24px,4vw,32px);margin:0 0 6px">${esc(u.title)}</h1><p>${esc(u.text)}</p></div></div>
      <div class="grid" style="margin:16px 0">${help.map(helpCard).join('')}</div>
      <p class="muted">Your answers are kept on this page. Come back and finish when you can.</p>
      <div class="row"><button class="btn go" data-act="ackurgent">Continue preparing</button><button class="btn line" data-act="showlist">Open my file now</button></div>
    </div>`, { inJourney: true });
  }
  function helpCard(h) {
    return `<div class="helpcard"><span class="helpnum">${esc(h.label)}</span><div><h3>${esc(h.name)}</h3><p class="small muted" style="margin:2px 0 0">${esc(h.detail)}</p>${h.href ? `<a class="small" href="${esc(h.href)}" target="_blank" rel="noopener">${esc(h.href.replace('https://', ''))}</a>` : ''}</div></div>`;
  }

  /* ============ YOUR FILE ============ */
  const STATUSES = [['have', 'I have it'], ['find', 'Need to find it'], ['others', 'Someone else has it'], ['unsure', 'Not sure'], ['na', 'Doesn\'t apply']];
  const ACTION_ST = [['have', 'Done'], ['find', 'To do'], ['na', 'Doesn\'t apply']];
  function viewList() {
    const iss = issue();
    const items = E.evidence(iss, S.answers);
    const must = new Set((S.adv && S.adv.issueId === iss.id && S.adv.must) || []);
    items.sort((a, b) => (must.has(b.id) - must.has(a.id)) || ((!!b.time) - (!!a.time)));
    const st = (e) => S.status[e.id] || '';
    const checked = items.filter((e) => st(e)).length;
    const urg = E.urgent(iss, S.answers); const infos = E.info(iss, S.answers);
    const quickLeft = E.nextQuestion(iss, S.answers, 'quick', S.skipped);
    const deepLeft = E.nextQuestion(iss, S.answers, 'deep', S.skipped);
    return shell(`<div class="wrap narrow" style="padding-bottom:30px">
      ${S.adv && S.adv.issueId === iss.id ? `<div style="margin-top:18px">${advBanner(S.adv)}</div>` : ''}
      <div class="filehead"><span class="tape" aria-hidden="true"></span><p class="typed">In the matter of: ${esc(S.topic ? S.topic.title : iss.short)}</p><h1>Your file</h1>
        <div class="stack" aria-hidden="true">${items.map((e) => `<i class="${st(e) === 'unsure' ? 'find' : st(e)}"></i>`).join('')}</div>
        <div class="legend"><span>${checked} of ${items.length} checked</span><span>${items.filter((e) => st(e) === 'have').length} in hand</span><span>${items.filter((e) => ['find', 'unsure'].includes(st(e))).length} to find</span><span>${items.filter((e) => st(e) === 'others').length} with others</span></div>
      </div>
      <p class="muted">These records <b>may</b> help your advocate. Mark each one. Missing records are fine — never a reason to delay seeing an advocate.</p>
      ${urg.map(urgentBanner).join('')}

  const encodeHex = (s) => Array.from(new TextEncoder().encode(s)).map((b) => b.toString(16).padStart(2, '0')).join('');
  function decodeHex(h) { try { return new TextDecoder().decode(new Uint8Array((h.match(/.{2}/g) || []).map((x) => parseInt(x, 16)))); } catch (e) { return ''; } }

      </form></div>`);
  }
  function makeAdvCode(id, mustIds, name, note) {
    const idx = BUILT.findIndex((i) => i.id === id); const ev = BY_ID[id].evidence;
    let mask = 0; mustIds.forEach((m) => { const k = ev.findIndex((e) => e.id === m); if (k >= 0) mask += 2 ** k; });
    return ['a', idx.toString(36), mask.toString(36), encodeHex(name.trim()), encodeHex(note.trim())].join('-');
  }
  function applyAdvLink(raw) {
    const p = raw.split('-'); const iss = BUILT[parseInt(p[1], 36)]; if (!iss) { location.hash = 'home'; return; }
    const mask = parseInt(p[2] || '0', 36) || 0;
    const must = iss.evidence.filter((e, k) => Math.floor(mask / 2 ** k) % 2 === 1).map((e) => e.id);
    if (S.issueId !== iss.id) S = blank();
    S.adv = { issueId: iss.id, must, name: decodeHex(p[3] || '').slice(0, 60), note: decodeHex(p[4] || '').slice(0, 140) };
    location.replace('#start-' + iss.id);
  }

<style id="appcss">/* Saboot — visual system */
:root{
  --paper:#FAF6EE; --sheet:#FFFFFF; --ink:#13294A; --ink2:#46566A; --muted:#6B7A72;
  --manila:#D7A455; --manila-d:#C98F2A; --manila-l:#F8EDD5; --sage:#A9C8AE; --sage-l:#EAF4EF;
  --tape:#B5472F; --tape-l:#F7E4DE;
  --go:#1E6B4E; --go-d:#14523B; --go-l:#E4F0E8;
  --amber:#C98A16; --amber-l:#FBF0D9;
  --line:#E7E1D3; --focus:#2E5BD6;
  --display:"Bricolage Grotesque","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Devanagari","Noto Sans Oriya",system-ui,-apple-system,"Segoe UI",sans-serif;
  --typed:"Courier Prime","Courier New",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--body)}
a{color:var(--go-d)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,h1[tabindex="-1"]:focus-visible,main:focus{outline:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.narrow{max-width:680px}

h1,h2,h3{font-family:var(--display);color:var(--ink);letter-spacing:-.015em;margin:0}
h1{font-size:clamp(34px,6.4vw,64px);line-height:1.02;font-weight:800}
h2{font-size:clamp(22px,3.2vw,30px);line-height:1.15;font-weight:700;margin-bottom:8px}
h3{font-size:18px;line-height:1.3;font-weight:700}
p{margin:0 0 12px}
.lead{font-size:clamp(17px,2.2vw,20px);color:var(--ink2);max-width:34em}
.muted{color:var(--muted)} .small{font-size:14px}

/* header */
header.top{position:sticky;top:0;z-index:30;background:rgba(250,246,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:6px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;color:var(--ink);background:none;border:0;cursor:pointer;padding:4px;margin-right:auto;letter-spacing:-.02em}
.nav{border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--ink2);font-weight:600;min-height:42px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.nav:hover{background:#F1ECE0;color:var(--ink)}
.nav.exit{background:var(--ink);color:#fff}
.lbl-short{display:none}
@media (max-width:640px){.nav .lbl-long{display:none}.nav .lbl-short{display:inline}.nav{padding:8px 7px;gap:4px;font-size:14px}.nav.lang .lbl-short{display:none}.brand{gap:7px}.brand span{font-size:16.5px}header.top .wrap{padding:0 12px;gap:2px}}
@media (max-width:380px){.brand span{display:none}}
body.calm.is-mobile .brand span{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1.5px solid transparent;padding:12px 20px;min-height:50px;font-weight:700;cursor:pointer;font-size:16px;text-decoration:none;font-family:var(--body)}
.btn.go{background:var(--go);color:#fff}
.btn.go:hover{background:var(--go-d)}
.btn.line{background:var(--sheet);border-color:var(--line);color:var(--ink)}
.btn.line:hover{border-color:var(--ink2)}
.btn.text{background:none;color:var(--go-d);padding:8px 4px;min-height:44px}
.btn.text:hover{text-decoration:underline}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ===== The file cover (hero) ===== */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;padding:52px 0 36px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:26px;padding:28px 0 18px}}
.hero .lead{margin-top:16px}
.cover{position:relative;background:var(--manila);border-radius:6px 18px 18px 18px;padding:34px 28px 26px 44px;box-shadow:0 1px 0 var(--manila-d),0 18px 40px -18px rgba(70,50,10,.45);isolation:isolate}
.cover::before{content:"";position:absolute;left:-1px;top:-22px;width:42%;height:24px;background:var(--manila);border-radius:10px 10px 0 0}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 6px);z-index:-1}
.tape{position:absolute;left:16px;top:-6px;bottom:-6px;width:10px;background:var(--tape);border-radius:2px;box-shadow:1px 0 0 rgba(0,0,0,.12)}
.cover .typed{font-family:var(--typed);font-size:15px;color:#5A4A22;margin:0 0 4px}
.cover label{display:block;font-family:var(--typed);font-size:15px;color:#5A4A22;margin-bottom:6px}
.matter{width:100%;background:transparent;border:0;border-bottom:2px solid #8E7740;font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:700;color:var(--ink);padding:8px 2px 10px;outline:none}
.matter::placeholder{color:#8E7740;opacity:.8;font-weight:600}
.matter:focus{border-bottom-color:var(--ink)}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.slipchip{background:var(--manila-l);border:1px solid var(--manila-d);border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer;color:#4A3C17}
.slipchip:hover{background:#fff}
.results{margin-top:14px;display:grid;gap:8px}
.res{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--manila-d);border-radius:10px;padding:12px 14px;cursor:pointer}
.res:hover{border-color:var(--ink)}
.res small{color:var(--muted);font-size:13px;white-space:nowrap}
.cover .foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;color:#5A4A22}

/* ===== Shelf: clubs as divider tabs ===== */
.shelf{margin:34px 0 10px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 0;margin:14px 0 0;border-bottom:2px solid var(--ink)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;background:#F1ECE0;border:0;border-radius:10px 10px 0 0;padding:10px 14px 9px;font-weight:700;font-size:14.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab:hover:not([aria-selected="true"]){background:#DADDD2}
.drawer{background:var(--sheet);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:8px 0}
.issue{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #EEF1F5;padding:15px 20px;cursor:pointer}
.issue:last-child{border-bottom:0}
.issue:hover{background:#F7F8FB}
.issue b{font-family:var(--display);font-size:17.5px;font-weight:700;color:var(--ink)}
.issue span{font-size:14px;color:var(--muted);grid-column:1}
.issue em{font-style:normal;grid-row:1/3;grid-column:2;font-size:13px;color:var(--ink2);background:var(--go-l);border-radius:999px;padding:4px 10px;white-space:nowrap}
.issue.gen em{background:#EEF1F5;color:var(--muted)}
@media (max-width:520px){.issue{grid-template-columns:1fr}.issue em{grid-row:auto;grid-column:1;justify-self:start;margin-top:4px}}

/* ===== Home: lower sections ===== */
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin:44px 0}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.qlist{list-style:none;padding:0;margin:12px 0 0}
.qlist li{border-bottom:1px solid var(--line)}
.qlist button{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 0;font-size:16.5px;font-weight:600;color:var(--ink);cursor:pointer}
.qlist button:hover{color:var(--go-d)}
.game{background:var(--ink);color:#fff;border-radius:18px;padding:26px;position:relative;overflow:hidden}
.game h2{color:#fff}
.game p{color:#D3DDEA}
.game .deck{position:relative;height:118px;margin:16px 0 20px}
.game .deck div{position:absolute;inset:0 10% 0 0;background:#fff;border-radius:12px;color:var(--ink);padding:16px;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.game .deck div:nth-child(1){transform:rotate(-5deg) translate(-6px,6px);background:#EAF4EF}
.game .deck div:nth-child(2){transform:rotate(3deg) translate(8px,2px);background:#F3F7F2}
.game .btn.go{background:var(--manila);color:var(--ink)}
.game .btn.go:hover{background:#F0DFB3}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:8px 0 40px;border-top:2px solid var(--ink)}
.how li{list-style:none;padding:16px 18px 0 0}
.how b{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px}
.how span{font-size:14.5px;color:var(--ink2)}
@media (max-width:760px){.how{grid-template-columns:1fr 1fr;row-gap:12px}}

/* ===== Quiz ===== */
.qwrap{padding:18px 0 140px}
.chapters{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--ink);margin-bottom:26px}
.chapters::-webkit-scrollbar{display:none}
.chap{flex:none;font-size:13px;font-weight:700;padding:8px 12px 6px;border-radius:9px 9px 0 0;background:#F1ECE0;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.chap.done{color:var(--ink2)}
.chap.done svg{color:var(--go)}
.chap.now{background:var(--ink);color:#fff}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;font-size:14px;color:var(--muted)}
.qtext{font-size:clamp(26px,4.6vw,38px);line-height:1.12;font-weight:800}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.opts{display:grid;gap:10px;margin:22px 0 18px}
.opt{position:relative;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-height:60px;cursor:pointer;font-size:17px;line-height:1.35;transition:transform .12s ease,border-color .12s}
.opt:hover{border-color:var(--ink2)}
.opt:active{transform:scale(.99)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.key{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--typed);font-weight:700;font-size:15px;color:var(--ink2);background:#F7F8FB}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:#FBF9F3}
.opt:has(input:checked) .key{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.why{border-left:3px solid var(--manila-d);background:var(--manila-l);padding:10px 14px;border-radius:0 10px 10px 0;font-size:15px;color:#4A3C17}
.why b{font-weight:700}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ===== The file tray (sticky) ===== */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none}
.tray .wrap{display:flex;justify-content:center}
.trayin{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--manila);border-radius:16px 16px 0 0;padding:12px 16px 12px 22px;box-shadow:0 -10px 30px -12px rgba(70,50,10,.4);min-width:min(560px,100%);position:relative}
.trayin::before{content:"";position:absolute;left:8px;top:8px;bottom:0;width:6px;background:var(--tape);border-radius:2px}
.trayin .count{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.trayin .lbl{font-size:13.5px;color:#4A3C17;line-height:1.25}
.trayin .btn{margin-left:auto;min-height:42px;padding:8px 14px;background:var(--ink);color:#fff;border-radius:10px;font-size:14.5px}
.flyslip{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600;max-width:300px;box-shadow:0 8px 24px rgba(14,58,44,.18);pointer-events:none}

/* ===== Chapter break ===== */
.break{padding:34px 0 140px}
.break .stamp{display:inline-block;font-family:var(--typed);font-weight:700;color:var(--tape);border:2.5px solid var(--tape);border-radius:6px;padding:4px 12px;transform:rotate(-4deg);margin-bottom:18px;font-size:16px}
.found{display:grid;gap:8px;margin:18px 0 22px}
.slip{background:#fff;border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:11px 14px;font-weight:600}
.tip{background:var(--ink);color:#fff;border-radius:14px;padding:18px 20px;margin:0 0 24px}
.tip b{font-family:var(--display);display:block;margin-bottom:4px;color:var(--manila)}

/* ===== Banners ===== */
.banner{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}
.banner.now{background:var(--tape-l);border:1.5px solid #E4AFA9}
.banner.soon{background:var(--amber-l);border:1.5px solid #ECCF91}
.banner.info{background:var(--go-l);border:1.5px solid #B5DCD5}
.banner.adv{background:#EAF4EF;border:1.5px solid #C2CDE4}
.banner svg{flex:none;margin-top:2px}
.banner h3{font-size:16.5px;margin:0 0 3px}
.banner p{margin:0;font-size:15px}

/* ===== Your file (evidence) ===== */
.filehead{background:var(--manila);border-radius:6px 16px 16px 16px;padding:24px 22px 20px 40px;position:relative;margin:26px 0 18px}
.filehead .tape{left:14px}
.filehead .typed{font-family:var(--typed);color:#5A4A22;font-size:15px;margin:0 0 4px}
.filehead h1{font-size:clamp(28px,5vw,44px)}
.stack{display:flex;gap:3px;margin:14px 0 6px}
.stack i{flex:1;height:8px;border-radius:3px;background:rgba(255,255,255,.55)}
.stack i.have{background:var(--go)} .stack i.find{background:var(--amber)} .stack i.others{background:var(--ink2)} .stack i.na{background:#B9A777}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:#4A3C17}
.ev{position:relative;background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:10px;padding:16px 16px 14px 18px;margin-bottom:12px}
.ev.flag{border-color:var(--ink);border-left-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ev h3{font-size:17.5px;padding-right:80px}
.ev .tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 6px}
.tag{font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.tag.time{background:var(--tape-l);color:var(--tape)} .tag.others{background:#EAF4EF;color:var(--ink)} .tag.act{background:#EEF1F5;color:var(--ink2)} .tag.adv{background:var(--ink);color:#fff}
.tag.draft{background:var(--amber-l);color:#7A5512}
.ev p.w{margin:0 0 6px;color:var(--ink2);font-size:15px}
.ev details{font-size:15px;margin:0 0 10px}
.ev summary{cursor:pointer;color:var(--go-d);font-weight:700}
.ev dl{margin:8px 0 0;display:grid;gap:4px}
.ev dt{font-weight:700;font-size:13.5px;color:var(--ink)}
.ev dd{margin:0 0 6px;color:var(--ink2)}
.sts{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:40px;font-weight:600;color:var(--ink2)}
.sbtn:hover{border-color:var(--ink2)}
.sbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.instamp{position:absolute;right:14px;top:12px;font-family:var(--typed);font-weight:700;color:var(--tape);border:2px solid var(--tape);border-radius:5px;padding:1px 8px;transform:rotate(-7deg);font-size:14px;background:#fff}
.instamp.pop{animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-7deg) scale(1.8);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.records{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--manila-l);border-radius:8px;padding:7px 12px;margin-bottom:6px;font-size:15px}
.rec code{font-family:var(--typed);font-weight:700;color:var(--tape);margin-right:8px}
.recform{display:grid;grid-template-columns:2fr 1fr 80px auto;gap:8px;align-items:end}
@media (max-width:620px){.recform{grid-template-columns:1fr 1fr}.recform .full{grid-column:1/-1}}
label.f{display:grid;gap:4px;font-size:13.5px;font-weight:700;color:var(--ink)}
.t{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:15px;min-height:46px;width:100%}
.t:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px #DCE3F3}
.deeper{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:18px 20px;margin:0 0 18px}
.deeper h3{color:#fff;font-size:19px}
.deeper p{margin:2px 0 0;color:#D3DDEA;font-size:15px}
.deeper .btn{background:var(--manila);color:var(--ink)}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--go)}

/* timeline */
.tl{list-style:none;padding:0;margin:0 0 16px 6px;border-left:2px solid var(--ink)}
.tl li{position:relative;padding:4px 0 14px 20px}
.tl li::before{content:"";position:absolute;left:-7px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
.tl .d{font-family:var(--typed);font-weight:700;font-size:14px}

/* questions hub */
.qa{background:var(--sheet);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.qa summary{list-style:none;cursor:pointer;padding:16px 18px;font-family:var(--display);font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:12px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";font-size:24px;line-height:1;color:var(--ink2)}
.qa[open] summary::after{content:"–"}
.qa .body{padding:0 18px 18px}
.qa ul{margin:4px 0 12px;padding-left:20px;color:var(--ink2)}
.qa .law{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink2)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* myth or fact */
.mf{max-width:560px;margin:0 auto;padding:30px 0 60px}
.mfcard{background:#fff;border-radius:18px;box-shadow:0 18px 40px -16px rgba(14,58,44,.35);padding:30px 26px;min-height:240px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);position:relative}
.mfcard .n{font-family:var(--typed);font-size:14px;color:var(--muted);margin-bottom:10px}
.mfcard p.s{font-family:var(--display);font-size:clamp(22px,4vw,28px);line-height:1.2;font-weight:700;margin:0}
.mfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.mfbtns .btn{min-height:64px;font-size:19px}
.mfresult{margin-top:16px;border-radius:14px;padding:16px 18px}
.mfresult.right{background:var(--go-l)} .mfresult.wrong{background:var(--tape-l)}
.mfresult b{font-family:var(--display);font-size:20px;display:block}
.score{font-family:var(--typed);font-weight:700}

/* help, about */
.helpcard{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.helpnum{flex:none;min-width:72px;text-align:center;font-family:var(--display);font-weight:800;color:var(--ink);font-size:19px;background:var(--manila-l);border-radius:9px;padding:8px 6px}
.helpcard h3{font-size:16px}
.grid{display:grid;gap:10px}

/* report */
.report{background:#fff;border:1px solid var(--line);border-radius:6px;padding:34px 32px;box-shadow:0 10px 30px -18px rgba(14,58,44,.3)}
.report h1{font-size:30px}
.report h2{font-size:19px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin-top:28px}
.report table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
.report th,.report td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.report th{background:#F1F2EC}
.report td.lab{font-family:var(--typed);font-weight:700;color:var(--tape);white-space:nowrap}
.report ul{padding-left:20px;margin:6px 0}
.report .instr{background:var(--manila-l);border-left:4px solid var(--tape);padding:12px 14px;font-weight:600;font-size:15px}
.report .meta{font-size:13px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 16px}

/* dialog, toast, footer */
.overlay{position:fixed;inset:0;background:rgba(14,58,44,.5);z-index:60;display:grid;place-items:center;padding:18px}
.dialog{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px}
.langopt{display:flex;justify-content:space-between;align-items:center;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:16px;text-align:left}
.langopt[aria-current="true"]{border-color:var(--ink)}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:14.5px;opacity:0;transition:all .2s;z-index:50;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer.foot{border-top:1px solid var(--line);margin-top:30px;padding:24px 0 120px;font-size:14px;color:var(--muted)}
footer.foot .row{gap:4px 16px}
footer.foot button{background:none;border:0;color:var(--go-d);cursor:pointer;padding:6px 0;text-decoration:underline;font-size:14px}

body.calm .opt:active{transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  header.top,footer.foot,.toolbar,.noprint,.toast,.tray{display:none!important}
  body{background:#fff;font-size:12pt}
  .report{border:0;box-shadow:none;padding:0}
  .report tr,.report li{break-inside:avoid}
}

@media (hover:none){.keytip{display:none}}
@media (max-width:860px){.hero>div:first-child .row{display:none}.hero .lead{font-size:16.5px}}

/* ===== v4: simple flow ===== */
.home{padding-bottom:20px}
.hero1{padding:40px 0 26px;max-width:760px}
.hero1 h1{font-size:clamp(32px,6vw,56px)}
.hero1 .lead{margin-top:14px}
.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:0 16px;margin-top:22px;box-shadow:0 6px 0 var(--manila)}
.searchbox svg{color:var(--ink2);flex:none}
.searchbox input{flex:1;border:0;outline:none;background:transparent;font-size:19px;padding:16px 0;min-width:0}
.home .results{margin-top:12px}
.home .suggest{margin-top:14px}
.home .slipchip{font-size:15px;padding:9px 13px;border-radius:999px}
.home h2{margin:26px 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr;gap:10px}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;min-height:132px}
.tile:hover{border-color:var(--ink)}
.tile b{font-family:var(--display);font-size:19px;line-height:1.2;margin-top:6px}
.tile span:last-child{font-size:14px;color:var(--muted);line-height:1.35}
@media (max-width:520px){.tile span:last-child{display:none}.tile{min-height:112px;justify-content:center}}
.tic{width:48px;height:48px;border-radius:12px;background:var(--manila-l);color:var(--ink);display:grid;place-items:center;flex:none}
.tic.big{width:54px;height:54px;margin-right:12px;vertical-align:middle;display:inline-grid}
.minirow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 10px}
@media (max-width:760px){.minirow{grid-template-columns:1fr}}
.mini{display:flex;gap:12px;align-items:center;text-align:left;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:16px;cursor:pointer}
.mini b{display:block;font-family:var(--display);font-size:17px}
.mini span{font-size:14px;color:#D3DDEA}
.mini svg{flex:none;color:var(--manila)}
.pageh{display:flex;align-items:center;font-size:clamp(30px,6vw,44px);margin-top:8px}
.probs{display:grid;gap:10px}
.prob{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 16px 16px 18px;cursor:pointer}
.prob:hover{border-color:var(--ink)}
.prob b{font-family:var(--display);font-size:19px;line-height:1.25}
.prob span{grid-column:1;font-size:15px;color:var(--muted)}
.prob svg{grid-row:1/3;grid-column:2;color:var(--ink2)}
.qwrap{padding:8px 0 150px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptitle{font-weight:700;color:var(--ink2);font-size:15px;text-align:right}
.bar{height:10px;background:#E1E4DA;border-radius:99px;overflow:hidden;margin:6px 0 22px}
.bar span{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .35s ease}
.opener{background:var(--manila-l);border-left:5px solid var(--tape);border-radius:0 12px 12px 0;padding:12px 16px;font-size:16px;color:#4A3C17;margin:0 0 18px}
.qtext{font-size:clamp(27px,5vw,40px)}
.opt{grid-template-columns:30px 1fr;min-height:64px;font-size:19px;padding:16px 18px}
.dot{width:26px;height:26px;border-radius:50%;border:2.5px solid #9AA3B2;display:grid;place-items:center}
.opt:has(input:checked) .dot{border-color:var(--go);background:var(--go)}
.opt:has(input:checked) .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.opt:has(input:checked){border-color:var(--go);box-shadow:inset 0 0 0 2px var(--go);background:#F1FAF8}
form.picked .opt:not(:has(input:checked)){opacity:.45}
details.why{font-size:15.5px;color:var(--ink2)}
details.why summary{cursor:pointer;color:var(--go-d);font-weight:700}
details.why p{margin:8px 0 0;background:var(--manila-l);padding:10px 14px;border-radius:10px}
.trayin .lbl{font-size:14px}
.filehead .fh{margin:8px 0 0;font-size:17px;color:#3E3214}
.stack i.have{background:var(--go)} .stack i.find{background:var(--amber)} .stack i.others{background:var(--ink2)} .stack i.na{background:#B9A777}
.deeper{width:100%;border:0;cursor:pointer;text-align:left;color:#fff}
.deeper b{display:block;font-family:var(--display);font-size:19px}
.deeper span{color:#D3DDEA;font-size:15px}
.deeper svg{color:var(--manila);flex:none}
.ev h3{font-size:19px}
.ev .sbtn{font-size:15px;padding:9px 14px;min-height:46px}
.ev.st-have{border-left-color:var(--go)}
.ev.st-na{opacity:.6}
.btn.big{min-height:56px;font-size:17px}
.wrap{padding-left:20px!important;padding-right:20px!important}
@media (max-width:520px){.wrap{padding-left:16px!important;padding-right:16px!important}}
@media (max-width:420px){.brand span{font-size:15px}.brand svg{width:26px;height:26px}.nav{padding:8px 5px;font-size:13.5px}header.top .wrap{padding-left:10px!important;padding-right:10px!important}}

/* ===== v5 premium layer + languages ===== */
:root{--paper:#FAF6EE;--line:#E7E1D3;--ink:#13294A;--ink2:#46566A;
  --sh1:0 1px 2px rgba(14,58,44,.05),0 2px 6px rgba(14,58,44,.04);
  --sh2:0 1px 2px rgba(14,58,44,.06),0 8px 24px -6px rgba(14,58,44,.12);
  --sh3:0 2px 4px rgba(14,58,44,.08),0 18px 40px -12px rgba(14,58,44,.22)}
html[data-script] body,html[data-script] .opt,html[data-script] .lead{font-family:var(--lfont),var(--body)}
html[data-script] h1,html[data-script] h2,html[data-script] h3,html[data-script] .tile b,html[data-script] .prob b{font-family:var(--lfont),var(--display);letter-spacing:0;line-height:1.3}
html[dir=rtl] .prob,html[dir=rtl] .tile{text-align:right}
html[dir=rtl] .tile{align-items:flex-end}
html[dir=rtl] .chev,html[dir=rtl] [data-go] svg.i-back{transform:scaleX(-1)}
header.top{background:rgba(255,255,255,.86);border-bottom:1px solid rgba(14,58,44,.07)}
.nav:hover{background:#F1ECE0}
.nav.lang{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff}
.band{background:radial-gradient(1200px 400px at 85% -10%,rgba(237,177,76,.18),transparent 60%),linear-gradient(180deg,#13294A 0%,#0B1F36 100%);color:#fff;padding:22px 0 34px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,rgba(237,177,76,.5),transparent)}
.band h1{color:#fff;font-size:clamp(32px,6vw,58px);margin-top:20px;max-width:15em}
.band .lead{color:rgba(255,255,255,.78);margin-top:12px}
.band .searchbox{border:0;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);max-width:640px;border-radius:14px}
.band .searchbox input{color:var(--ink)}
.band .results{max-width:640px;color:var(--ink)}
.band .slipchip{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18)}
.band .slipchip:hover{background:rgba(255,255,255,.16)}
.langbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.langbar::-webkit-scrollbar{display:none}
.lchip{flex:none;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.88);border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lchip:hover{background:rgba(255,255,255,.1)}
.lchip[aria-pressed=true]{background:#D7A455;color:#13294A;border-color:#D7A455;font-weight:700}
.home h2{font-size:clamp(20px,2.6vw,24px);margin:30px 0 14px}
.tile{border:1px solid var(--line);box-shadow:var(--sh1);transition:transform .16s ease,box-shadow .16s ease,border-color .16s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh3);border-color:#D8D2C2}
.tic{background:#13294A;color:#D7A455;border-radius:14px}
.tile .tic{width:46px;height:46px}
.prob{border:1px solid var(--line);box-shadow:var(--sh1);transition:box-shadow .15s,transform .15s}
.prob:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.opt{border:1px solid var(--line);box-shadow:var(--sh1)}
.opt:hover{box-shadow:var(--sh2)}
.mini{box-shadow:var(--sh1);border:1px solid var(--line)}
.ev{border:1px solid var(--line);border-left:4px solid var(--tape);box-shadow:var(--sh1);border-radius:12px}
.panel{box-shadow:var(--sh2);border:1px solid var(--line)}
.trnote{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:6px 10px;margin:4px 0 12px}
.trnote .btn.text{padding:2px 6px;min-height:0;font-size:13.5px}
.dialog.wide{max-width:720px;max-height:86vh;overflow:auto}
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.langopt{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--sh1)}
.langopt b{font-size:18px;font-weight:700}
.langopt span{font-size:12.5px;color:var(--muted)}
.langopt:hover{border-color:var(--ink)}
.langopt[aria-current=true]{background:#13294A;color:#fff;border-color:#13294A}
.langopt[aria-current=true] span{color:rgba(255,255,255,.7)}
.busy{text-align:center;padding:90px 20px}
.busy h1{font-size:clamp(22px,3.4vw,30px);margin:18px 0 8px}
.spinner{width:44px;height:44px;margin:0 auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}.tile:hover,.prob:hover{transform:none}}
@media (max-width:520px){.band{padding:16px 0 26px}.band h1{margin-top:16px}.lchip{padding:6px 12px;font-size:14px;min-height:36px}}

/* v6: situation check + question counter */
.barrow{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;margin:10px 0 14px}
.barrow .bar{flex:1;min-width:0;width:auto;margin-top:0;margin-bottom:0}
.qcount{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:end}
.standcard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);padding:18px 18px 8px;margin:4px 0 16px}
.standcard h2{font-size:20px;margin-bottom:10px}
.srow{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow b{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.srow ul{margin:0;padding-inline-start:18px}
.srow li{margin:3px 0;line-height:1.45}
.sic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.s-good .sic{background:var(--go-l);color:var(--go-d)} .s-good b{color:var(--go-d)}
.s-risk .sic{background:var(--amber-l);color:#8a5a00} .s-risk b{color:#8a5a00}
.s-next .sic{background:#EAF4EF;color:var(--ink)} .s-next b{color:var(--ink)}
html[data-script] .srow b{text-transform:none;letter-spacing:0}

/* v7: carry checklist */
.carryhead{background:#13294A;color:#fff;border-radius:18px;padding:20px 20px 18px;margin:8px 0 14px;box-shadow:var(--sh2)}
.carryhead .typed{color:#D7A455;margin:0 0 4px;font-size:14px}
.carryhead h1{color:#fff;font-size:clamp(26px,5vw,36px);line-height:1.15}
.carryhead .fh{color:rgba(255,255,255,.82);margin:8px 0 0}
.carryhead .fh b{color:#D7A455}
.lh{font-size:19px;margin:20px 0 10px}
.checks{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:40px 1fr;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh1)}
.crow.act{border-inline-start:4px solid var(--amber)}
.crow.on{background:#F2FAF8;border-color:#BFE3DC}
.crow.on h3{color:var(--go-d)}
.cbox{width:36px;height:36px;border-radius:10px;border:2px solid #B7BECB;background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;color:#fff}
.crow.on .cbox{background:var(--go);border-color:var(--go)}
.cbox:hover{border-color:var(--ink)}
.cbody h3{font-size:17px;line-height:1.3;margin:4px 0 4px}
.cbody .w{margin:0;color:var(--ink2);font-size:15px}
.ctime{margin:8px 0 0;font-size:14px;font-weight:600;color:#8a5a00;display:flex;gap:6px;align-items:flex-start}
.cbody details{margin-top:6px}
.cbody details summary{font-size:14px;color:var(--go-d);cursor:pointer;font-weight:600}
.cbody details p{font-size:14px;margin:6px 0 0;color:var(--ink2)}
@media print{.crow{box-shadow:none;break-inside:avoid}.carryhead{background:#fff;color:#000;box-shadow:none;border:1px solid #000}.carryhead h1,.carryhead .fh,.carryhead .typed{color:#000}}

/* v8: Saboot brand */
.brand span{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--ink)}
.band{background:radial-gradient(900px 380px at 92% -20%,rgba(169,200,174,.28),transparent 60%),radial-gradient(600px 300px at -10% 120%,rgba(237,177,76,.14),transparent 60%),linear-gradient(180deg,#13294A 0%,#0B1F36 100%)}
.band .searchbox{box-shadow:0 18px 40px -12px rgba(0,0,0,.4)}
.tic{background:var(--ink);color:var(--manila)}
.lchip[aria-pressed=true]{background:var(--manila);border-color:var(--manila);color:#0B1F36}
.btn.go{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.go:hover{background:#0B1F36}
.crow.on{background:var(--sage-l);border-color:var(--sage)}
.crow.on .cbox{background:var(--go);border-color:var(--go)}
.carryhead{background:linear-gradient(180deg,#13294A,#0B1F36)}
.carryhead .typed,.carryhead .fh b{color:var(--manila)}
.mini{background:var(--ink)}
.deeper{background:var(--ink)}

/* v9: Saboot brand board, used as supplied */
:root{--paper:#FCFAF4;--ink:#0B1F36;--ink2:#3C524C;--manila:#D7A455;--manila-l:#FBEFD9;--sage:#ABC5A8;--sage-l:#E9F0E6;--go:#1B3A5C;--go-d:#0B1F36;--go-l:#E6EFE9;--line:#E9E3D6}
header.top{background:rgba(252,250,244,.95)}
.brand{padding:2px 0}
.blogo{height:38px;width:auto;display:block}
@media (max-width:420px){.blogo{height:30px}}
.hero2{background:#EEF4FB;overflow:hidden;position:relative}
.hero2::before{content:"";position:absolute;inset:0 auto 0 0;width:52%;background:var(--paper);border-radius:0 0 56% 0 / 0 0 30% 0}
.hero2in{position:relative;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:20px;min-height:520px}
.hcopy{padding:40px 0}
.hcopy h1{font-family:var(--display);color:var(--ink);font-size:clamp(32px,4.4vw,52px);line-height:1.08;font-weight:700;letter-spacing:-.02em;max-width:12em}
.hcopy .lead{color:#4E5E58;margin:16px 0 26px;font-size:clamp(18px,1.8vw,22px);line-height:1.45}

.resume .btn.sm{min-height:40px;padding:6px 14px;font-size:14px;border-radius:999px}
.sosbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;background:#FDF3F1;border:1px solid #EFC9C2;color:#7A2418;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600}
.sosbar>svg{flex:none}
.sosbar>span:first-of-type{flex:1 1 220px}
.sosnums{display:flex;gap:8px;flex-wrap:wrap}
.sosnum{display:inline-flex;align-items:center;gap:5px;background:#B3261E;color:#fff;text-decoration:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;min-height:38px}
.sosnum small{font-weight:500;opacity:.9;font-size:12.5px}
.sosnum:hover{background:#951f18}
.homeh{margin:22px 0 10px}
.home .searchbox{margin:0 0 12px}
.situcard{min-height:0!important;gap:6px!important;padding:13px 14px!important}
.situcard>span:not(.fic){flex:0!important}
.situcard em{display:none}
.areas{margin-top:24px}
.areas h2{margin:0 0 10px}
.arealist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.arow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-height:54px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.arow:hover{border-color:var(--go);background:#FBFDFB}
.arow .tic{width:34px!important;height:34px!important;border-radius:9px!important;flex:none;display:grid;place-items:center}
.arow b{flex:1;font-size:15px;line-height:1.25;font-weight:650}
.arow>svg:last-child{flex:none;color:var(--muted)}
@media (max-width:1023px){ .arealist{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:760px){
  .home{padding-top:14px}
  .sosbar{font-size:14px;padding:10px 12px}
  .sosnum{padding:6px 10px;font-size:14px}
  .sosnum small{display:none}
  .arealist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .arow{min-height:52px;padding:8px}
  .arow b{font-size:14.5px}
  .arow .tic{width:30px!important;height:30px!important}
}

/* v24b: simple start page */
.startbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:18px 0 8px}
.startbox .btn.big{min-width:200px}
.startbox p{margin:0}
.lawbox{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.lawbox>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink2);font-size:15px;min-height:40px}
.lawbox>summary::-webkit-details-marker{display:none}
.lawbox>summary svg:last-child{margin-left:auto;transition:transform .2s}
.lawbox[open]>summary svg:last-child{transform:rotate(180deg)}
@media (max-width:760px){ .startbox .btn.big{width:100%} }

/* v25: new Saboot logo (navy S + gold dot) and a welcoming pastel palette.
   Rules: pastel for surfaces only; text and buttons stay dark navy for readability; urgent stays clearly red. */
:root{--ink:#0B1F36;--ink2:#46566A;--muted:#566476;--go:#1B3A5C;--go-d:#0B1F36;--go-l:#EAF1FA;--manila:#D7A455;--manila-l:#FFF4D6;--manila-d:#C9A14E;
  --paper:#FBF8F3;--line:#ECE5D8;--sage:#BFDCCB;--sage-l:#EAF4EF;
  --p-mint:#E3F4EC;--p-sky:#E3EEFB;--p-lav:#EEE9FA;--p-peach:#FDEBDD;--p-butter:#FFF3D3;--p-rose:#FCE8E8}
body{background:var(--paper)}
header.top{background:rgba(251,248,243,.94)}
.brand{gap:8px}
.bicon{width:auto;height:34px;border-radius:0}
.bwordimg{height:24px;width:auto;display:block}
.bword{display:none}
.fmark img.fm{height:46px;width:auto;border-radius:0}
.fmark img.fw{height:28px;width:auto;display:block;margin-bottom:4px}
.fmark b{display:none}
footer.foot{background:#F6F1E8}
/* buttons */
.btn.go,.getstarted{background:var(--go);border-color:var(--go);color:#fff}
.btn.go:hover,.getstarted:hover{background:#13294A}
/* hero */
.hero2::before{background:linear-gradient(180deg,#E9F3EE 0%,#E6EFE7 100%)}
/* category list: one soft colour per area, navy icons */
.arow{border-color:transparent}
.arow .tic{background:#fff!important;color:var(--ink)!important}
.arow.pc0{background:var(--p-mint)}.arow.pc1{background:var(--p-sky)}.arow.pc2{background:var(--p-peach)}
.arow.pc3{background:var(--p-lav)}.arow.pc4{background:var(--p-butter)}.arow.pc5{background:var(--p-rose)}
.arow:hover{border-color:var(--go);filter:saturate(1.15)}
/* situation cards: soft tint by topic */
.situcard{border-color:transparent}
.situcard:has(.fic.rose){background:var(--p-rose)}.situcard:has(.fic.sand){background:var(--p-butter)}
.situcard:has(.fic.sky){background:var(--p-sky)}.situcard:has(.fic.sage){background:var(--p-mint)}
.situcard .fic{background:#fff!important}
/* big icon squares elsewhere */
.tic{background:var(--p-sky);color:var(--ink)}
.tic.big{background:var(--p-butter)!important;color:var(--ink)!important}
/* SOS stays clearly urgent but softer around it */
.sosbar{background:#FDEEEC;border-color:#F3CFC9}
/* panels and cards */
.panel,.helpcard,.crow,.accg,.qa{border-color:var(--line)}
.carryhead{background:var(--p-mint)!important;color:var(--ink)!important}
.carryhead h1,.carryhead .typed,.carryhead p{color:var(--ink)!important}
.filehead{background:var(--p-butter)!important}
.trnote{background:var(--p-sky);border-color:#CFDDF0}
.resume{background:var(--p-mint);border-color:#CDE6D8}
/* v25b — image logo on small phones */
@media (max-width:640px){.bicon{height:30px;width:auto}.bwordimg{height:21px;width:auto}}
@media (max-width:420px){.bicon{height:27px}.bwordimg{height:19px}.nav.lang{padding:6px 9px}.nav.exit span{display:none}.nav.exit{padding:8px 9px}}
@media (max-width:350px){.bwordimg{display:none}}
/* v26 — areas = one quiet list panel, distinct from the pastel situation cards */
.areas{margin-top:34px}
.areas .lh{font-size:15px!important;font-weight:700;color:var(--ink2);text-transform:none;letter-spacing:0;margin-bottom:10px}
.arealist{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;gap:0!important;display:grid;grid-template-columns:1fr 1fr}
.arow,.arow.pc0,.arow.pc1,.arow.pc2,.arow.pc3,.arow.pc4,.arow.pc5{background:#fff!important;border:0!important;border-radius:0!important;border-bottom:1px solid var(--line)!important;min-height:58px;filter:none!important}
.arealist .arow:nth-child(odd){border-right:1px solid var(--line)!important}
.arow:hover{background:#FBF8F3!important}
.arow b{font-weight:600}
.arow.pc0 .tic{background:var(--p-mint)!important}.arow.pc1 .tic{background:var(--p-sky)!important}.arow.pc2 .tic{background:var(--p-peach)!important}
.arow.pc3 .tic{background:var(--p-lav)!important}.arow.pc4 .tic{background:var(--p-butter)!important}.arow.pc5 .tic{background:var(--p-rose)!important}
@media (max-width:560px){.arealist{grid-template-columns:1fr}.arealist .arow:nth-child(odd){border-right:0!important}.arow{min-height:54px}}
@media (max-width:560px){.arealist{grid-template-columns:1fr 1fr}.arealist .arow:nth-child(odd){border-right:1px solid var(--line)!important}.arow{min-height:56px;padding:8px 8px!important;gap:8px!important}.arow b{font-size:13.5px}.arow>svg:last-child{display:none}}
/* v27 — ready-folder logo */
.brand{gap:9px!important;align-items:center}
.bicon{height:28px!important;width:auto!important}
.bwordimg{height:26px!important;width:auto!important;margin-top:-2px}
.fmark img.fm{height:44px!important;width:auto!important}
.fmark img.fw{height:32px!important;width:auto!important;margin-bottom:2px}
@media (max-width:640px){.bicon{height:25px!important}.bwordimg{height:23px!important}}
@media (max-width:420px){.bicon{height:23px!important}.bwordimg{height:21px!important}.brand{gap:7px!important}}
/* v28 — bigger, bolder hero headline */
.hcopy h1{font-weight:800!important;font-size:clamp(38px,5.3vw,66px)!important;letter-spacing:-.03em!important;line-height:1.03!important;max-width:11em!important}
@media (max-width:700px){.hcopy h1{font-size:clamp(32px,9.6vw,42px)!important}}

<script>/* Saboot knowledge base — Phase 1 (English).
   Status: DRAFT authored content. Not yet reviewed by a practising advocate.

(function (root) {

  const o = (pairs) => pairs.map(([id, label]) => ({ id, label }));

  const PN = ['prefer_not', 'Prefer not to say'];

  const KB_VERSION = '2.0.0-draft';
  const REVIEWED = { status: 'draft', label: 'Draft — not yet reviewed by an advocate', date: null };

  /* ---------- Official help directory ---------- */
  const HELP = {
    e112: { label: '112', name: 'Emergency Response (police, fire, ambulance)', detail: 'Call 112 if anyone is in immediate danger.', href: null },
    w181: { label: '181', name: 'Women Helpline', detail: 'Support for women facing violence or threats.', href: null },
    c1098: { label: '1098', name: 'Childline', detail: 'For a child at risk or in need of care.', href: null },
    s14567: { label: '14567', name: 'Elderline (senior citizens)', detail: 'National helpline for older persons.', href: null },
    cy1930: { label: '1930', name: 'National Cyber Crime Helpline', detail: 'Report financial cyber fraud quickly. Online: cybercrime.gov.in', href: 'https://cybercrime.gov.in' },
    l15100: { label: '15100', name: 'NALSA free legal aid helpline', detail: 'Free legal advice and a panel advocate if you are eligible.', href: 'https://nalsa.gov.in' },

    nch: { label: '1915', name: 'National Consumer Helpline', detail: 'Pre-litigation help for consumer complaints. Online: consumerhelpline.gov.in', href: 'https://consumerhelpline.gov.in' },
    ejag: { label: 'e-Jagriti', name: 'Consumer Commission e-filing', detail: 'Official portal for filing consumer complaints (replaced e-Daakhil from 1 Jan 2025).', href: 'https://e-jagriti.gov.in' },
    ins: { label: 'Bima Bharosa', name: 'IRDAI insurance grievance portal', detail: 'Complain about an insurer after its own grievance cell; then the Insurance Ombudsman.', href: 'https://bimabharosa.irdai.gov.in' },
    cio: { label: 'Ombudsman', name: 'Insurance Ombudsman (Council for Insurance Ombudsmen)', detail: 'Free route for many claim rejections after the insurer replies or 30 days pass.', href: 'https://www.cioins.co.in' },

  };

  const CATEGORIES = [
    { id: 'money', title: 'Money & banking', blurb: 'Cheques, loans, cards, UPI fraud, frozen accounts', icon: 'bank' },
    { id: 'family', title: 'Family', blurb: 'Divorce, maintenance, custody, violence at home, inheritance', icon: 'family' },
    { id: 'shopping', title: 'Shopping & services', blurb: 'Refunds, defective goods, insurance, builders', icon: 'bag' },
    { id: 'home', title: 'Home & land', blurb: 'Rent, deposits, eviction, encroachment', icon: 'house' },
    { id: 'police', title: 'Police & notices', blurb: 'FIR, arrest, summons, legal notices', icon: 'shield' },
    { id: 'work', title: 'Work', blurb: 'Salary, termination, harassment at work', icon: 'user' },
    { id: 'accidents', title: 'Accidents', blurb: 'Road accidents and injury claims', icon: 'umbrella' },

  /* ---------- Shared lawful-collection rules ---------- */
  const LAWFUL = 'Only collect records you are lawfully entitled to. Do not access another person\'s phone, email or accounts without permission.';

  /* =====================================================================
     JOURNEYS
     q fields: id, text, why, type ('single'|'multi'), options, when, deep, chapter, sensitive
     e fields: id, name, fact, why, where, preserve, limit, time, when, holder ('me'|'others')
     ===================================================================== */
  const ISSUES = [];

  /* ---------------- 1. Bank account frozen ---------------- */
  ISSUES.push({
    id: 'bank-account-frozen', cat: 'money', title: 'My bank account has been frozen',
    short: 'Bank account frozen',
    synonyms: ['account frozen', 'account blocked', 'debit freeze', 'lien', 'hold on account', 'cannot withdraw', 'account restricted', 'kyc block', 'cyber police freeze'],
    intro: 'We will work out why the account was restricted, because the records you need depend on the reason.',

    questions: [

        options: o([['txn_failed', 'A payment or withdrawal failed'], ['bank_told', 'The bank told me (SMS, email, call or at the branch)'], ['authority', 'Police or another authority contacted me'], NS]) },
      { id: 'bf_reason', text: 'What reason have you been given?', why: 'A KYC block, a police request and a court or tax order each need different records and a different next step.',
        options: o([['kyc', 'KYC / documents not updated'], ['police', 'Police or cyber-crime investigation'], ['suspicious', 'Suspicious or disputed transaction'], ['order', 'Court, tax or other government order'], ['none', 'No reason given'], NS]) },
      { id: 'bf_written', text: 'Do you have any written message or notice about the restriction?', why: 'A written communication usually names who asked for the freeze. That decides who can lift it.',
        options: o([['yes', 'Yes'], ['no', 'No'], NS]) },
      { id: 'bf_scope', text: 'Is the whole account blocked, or only a part of the money?', why: 'Sometimes only a specific amount is held (a "lien"). The rest may remain usable.',
        options: o([['full', 'Whole account blocked'], ['partial', 'Only part of the money is held'], NS]) },
      { id: 'bf_received', text: 'Before the freeze, did you receive money from someone you did not know well?', why: 'Accounts are often frozen because they received part of money that someone else reported as stolen — for example from a buyer, a crypto (P2P) trade, a gaming app or a stranger.',
        when: W('bf_reason', 'police', 'suspicious', 'none', 'unsure'),
        options: o([['yes', 'Yes'], ['no', 'No'], NS]) },
      { id: 'bf_police_contact', text: 'Have the police given you anything?', deep: true, chapter: 'Notices',
        why: 'Police notices often carry a date to appear or respond.',
        when: ANY(W('bf_reason', 'police'), W('bf_how', 'authority')),
        options: o([['notice', 'A written notice or FIR number'], ['called', 'Only a phone call'], ['no', 'Nothing yet'], NS]) },
      { id: 'bf_kyc_attempts', text: 'Have you already submitted your KYC documents again?', deep: true, chapter: 'KYC',
        why: 'If you submitted and the block continued, the acknowledgement matters.',
        when: W('bf_reason', 'kyc'),
        options: o([['submitted', 'Yes, submitted'], ['rejected', 'Tried, but it was refused'], ['no', 'Not yet']]) },
      { id: 'bf_needs', text: 'Do you need this account for any of these?', type: 'multi', deep: true, chapter: 'Impact',
        why: 'Hardship can matter when asking for the freeze to be reduced or lifted.',
        options: o([['salary', 'Receiving salary'], ['business', 'Running a business'], ['medical', 'Medical or urgent family costs'], ['none', 'None of these']]) },
      { id: 'bf_complained', text: 'Have you complained to the bank in writing?', deep: true, chapter: 'Complaints',
        why: 'A written complaint with a reference number creates a record and opens the RBI complaint route if needed.',
        options: o([['yes_ref', 'Yes, I have a reference number'], ['verbal', 'Only spoke to them'], ['no', 'No']]) }
    ],
    evidence: [
      { id: 'bf_e_notice', name: 'The freeze message or notice', fact: 'Who restricted the account and why',
        why: 'It usually names the authority or reason. This decides who can lift the freeze.',
        where: 'SMS, email, net-banking alert, or a letter from the branch.', preserve: 'Keep the original SMS or email. Screenshot it with the date and sender visible.',
        when: W('bf_written', 'yes') },
      { id: 'bf_e_request', name: 'Your written request to the bank asking for the reason', fact: 'Who restricted the account and why',
        why: 'Without a written reason, it is hard to know whether to approach the bank, the police or a court.',
        where: 'Write to your branch or the bank\'s grievance email. Ask: the reason, the authority that asked for the freeze, its reference number, and the amount held.',
        preserve: 'Keep the sent email or a stamped acknowledgement copy.', when: NOT(W('bf_written', 'yes')), action: true },
      { id: 'bf_e_statement', name: 'Account statement from about 6 months before the freeze to today', fact: 'Which transactions triggered the freeze',
        why: 'Your advocate can see the credits that may be linked and the balance that is held.',
        where: 'Net banking (download PDF) or request at the branch.', preserve: 'Download the official PDF. Do not edit it.' },
      { id: 'bf_e_credits', name: 'Details of the specific incoming payments (date, amount, UTR/reference, sender)', fact: 'Whether you received disputed money',
        why: 'Freezes linked to cyber complaints usually point to particular credits.',
        where: 'Your statement and UPI app history.', preserve: 'Note the 12-digit UTR for each payment.', when: W('bf_received', 'yes', 'unsure') },
      { id: 'bf_e_deal', name: 'Proof of the deal behind those payments', fact: 'Whether you received the money in good faith',
        why: 'Invoices, chats with the buyer, or a trading platform order record can show why the money came to you.',
        where: 'Your messages, email, invoices, trading-platform order history.', preserve: 'Export the complete chat, not cropped screenshots.',
        limit: 'Showing a genuine deal does not automatically lift a freeze; the investigating agency or a court decides.', when: W('bf_received', 'yes') },
      { id: 'bf_e_police', name: 'Police notice, FIR number or cyber-complaint reference', fact: 'Which investigation the freeze is linked to',
        why: 'Your advocate needs the case details to approach the police or the court.',
        where: 'From the bank\'s reply, the police notice, or by asking the bank for the requesting agency.', preserve: 'Keep the original notice and the envelope.',

        when: ANY(W('bf_reason', 'police'), W('bf_police_contact', 'notice')) },

  /* ---------------- 2. UPI / cyber fraud ---------------- */
  ISSUES.push({

  Q('family', 'mutual-divorce-time', 'How long does a mutual consent divorce take?',
    'Under the Hindu Marriage Act, a couple must usually have lived separately for at least a year before filing jointly. After the first motion there is a six-month waiting period before the final decree, which courts can waive in suitable cases. In practice many cases finish in 6 to 18 months.',
    ['Which law your marriage falls under', 'Whether all terms (money, children, belongings) are agreed', 'Whether the court agrees to waive the waiting period'],
    'Hindu Marriage Act s.13B; Special Marriage Act s.28; Amardeep Singh v. Harveen Kaur (2017)', 'divorce-separation', ['mutual divorce', 'divorce time', 'cooling period']);
  Q('family', 'divorce-grounds', 'On what grounds can I file for divorce without my spouse\'s consent?',
    'Common grounds include cruelty, desertion for two years, adultery, conversion, serious mental disorder and not being heard of for seven years. The exact grounds depend on the personal law or the Special Marriage Act that applies. Cruelty includes serious mental cruelty, not only physical violence.',
    ['Personal law that governs your marriage', 'The evidence available for the ground', 'How long you have been separated'], 'Hindu Marriage Act s.13; Special Marriage Act s.27; Divorce Act 1869', 'divorce-separation', ['contested divorce', 'grounds of divorce', 'cruelty']);
  Q('family', 'wife-maintenance', 'Can a wife claim maintenance, and how much?',
    'Yes. A wife, children and parents who cannot maintain themselves can claim maintenance, including during a divorce case. Courts consider both sides\' income, needs and lifestyle; both parties usually file a sworn affidavit of income and assets. There is no fixed percentage.',
    ['Both spouses\' income and assets', 'Children\'s needs', 'Which law and forum the claim is filed under'], 'BNSS s.144 (formerly CrPC 125); Hindu Adoptions & Maintenance Act; DV Act; Rajnesh v. Neha (2020)', 'maintenance', ['alimony', 'maintenance amount', 'interim maintenance']);
  Q('family', 'husband-maintenance', 'Can a husband claim maintenance from his wife?',
    'Under the Hindu Marriage Act, either spouse can seek maintenance during and after divorce proceedings if they lack independent income. Under the general BNSS provision, only a wife (not a husband) can claim from a spouse.',
    ['Which law the case is under', 'Each spouse\'s earning capacity'], 'Hindu Marriage Act ss.24–25; BNSS s.144', 'maintenance', ['husband alimony']);
  Q('family', 'custody-mother', 'Does the mother always get custody of the child?',
    'Not always. The child\'s welfare is the paramount consideration. Under Hindu law, custody of a child under five is ordinarily with the mother, but courts can decide differently. The other parent usually gets visiting rights.',
    ['Child\'s age and wishes', 'Who has been the primary carer', 'Any safety concerns'], 'Guardians and Wards Act 1890; Hindu Minority and Guardianship Act 1956 s.6', 'child-custody', ['child custody', 'who gets child']);
  Q('family', 'daughter-share', 'Does a married daughter have a share in her father\'s property?',
    'Yes, for Hindu families. Since the 2005 amendment, a daughter is a coparcener in ancestral (joint family) property by birth, with the same rights as a son, whether married or not. She also inherits her father\'s self-acquired property equally with other Class I heirs if he died without a will.',
    ['Whether the property is ancestral or self-acquired', 'Whether there is a valid will', 'Whether a partition was completed before 20 Dec 2004'], 'Hindu Succession Act s.6 (2005 amendment); Vineeta Sharma v. Rakesh Sharma (2020)', 'inheritance-partition', ['daughter right', 'sister share', 'father property']);
  Q('family', 'succession-vs-heir', 'What is the difference between a succession certificate and a legal heir certificate?',
    'A succession certificate is issued by a civil court and is mainly used to collect debts and securities of a deceased person — like bank deposits and shares. A legal heir certificate is issued by the state revenue authority and identifies the heirs for purposes such as pensions, utilities and mutation.',
    ['The asset you want to claim', 'Whether there is a will (then probate or letters of administration may be needed)'], 'Indian Succession Act, Part X', 'inheritance-partition', ['succession certificate', 'legal heir certificate']);
  Q('family', 'nominee-owner', 'Does the nominee become the owner of a deceased person\'s bank account or policy?',
    'Generally no. A nominee receives the money but holds it for the legal heirs, who are entitled to it under succession law or the will. Some special rules apply to shares and insurance — ask an advocate about your asset.',

  Q('family', 'dv-what', 'What counts as domestic violence?',
    'Domestic violence includes physical, sexual, verbal, emotional and economic abuse by a husband, partner or his relatives — not only beating. Economic abuse includes withholding money, stridhan or access to the shared home. A Magistrate can order protection, residence, monetary relief and custody.',

  Q('money', 'failed-upi', 'Money got debited but the UPI payment failed. When will I get it back?',
    'Under RBI\'s timelines, failed UPI transfers to a person should be reversed by the next day (T+1); payments to merchants within 5 days (T+5). If the bank is late, it owes ₹100 per day of delay.',
    ['Type of payment', 'Whether the beneficiary was credited'], 'RBI circular on TAT for failed transactions (2019)', 'failed-payment-debited', ['upi failed', 'money debited']);
  Q('money', 'recovery-agent', 'What can recovery agents legally do?',
    'They can contact you to recover dues, but must not threaten, abuse, humiliate, or contact your friends and relatives to shame you. RBI rules restrict calls to between 8 am and 7 pm. Complain to the lender and then the RBI Ombudsman; threats can be reported to police.',
    ['Whether the lender is RBI-regulated', 'What exactly was said or done'], 'RBI directions on recovery agents and digital lending', 'loan-recovery', ['recovery agent harassment', 'loan harassment']);
  Q('money', 'sarfaesi', 'The bank sent a SARFAESI notice. Will I lose my house?',
    'A demand notice gives you 60 days to pay. You can send written objections, which the bank must answer. If the bank later takes possession, you can challenge it before the Debts Recovery Tribunal, usually within 45 days. Restructuring or settlement is often still possible.',
    ['Amount due and loan type', 'Whether procedure was followed'], 'SARFAESI Act ss.13(2), 13(3A), 13(4), 17', 'loan-recovery', ['sarfaesi notice', '13(2)', 'bank auction']);
  Q('money', 'card-closure', 'My bank isn\'t closing my credit card. What can I do?',
    'Under RBI rules, a closure request should be completed within 7 working days if there are no dues. After that, the issuer must pay you ₹500 per day of delay until the card is closed.',
    ['Whether dues are pending', 'Date of your request'], 'RBI Master Direction on Credit and Debit Cards (2022)', 'credit-card-dispute', ['close credit card']);
  Q('money', 'cibil-correction', 'How do I correct a wrong entry in my CIBIL report?',
    'Raise a dispute with the credit bureau (and the lender). The correction should be done within 30 days; RBI rules provide compensation of ₹100 per day for delay beyond that.',
    ['Who caused the error', 'Proof you have'], 'RBI framework on credit information compensation (2023)', 'credit-report-error', ['cibil', 'credit score correction']);
  Q('money', 'money-lent-no-paper', 'I lent money without any written agreement. Can I still recover it?',
    'Possibly. Bank transfers, messages asking for the money or promising to repay, and part-payments can together prove a loan. Money claims generally have a three-year limit, which a written acknowledgement or part-payment can extend.',
    ['How the money was given', 'Any written acknowledgement', 'Date of the loan and last acknowledgement'], 'Limitation Act ss.18–19; Order XXXVII CPC (summary suits)', 'money-lent-not-returned', ['recover money', 'hand loan']);

  /* ---------- Shopping ---------- */
  Q('shopping', 'consumer-complaint', 'How do I file a consumer complaint?',
    'First complain to the seller in writing, and try the National Consumer Helpline (1915). If unresolved, file on e-Jagriti before the District Commission (if you paid up to ₹50 lakh), the State Commission (₹50 lakh–₹2 crore), or the National Commission (above ₹2 crore). You can file without a lawyer.',
    ['Amount paid', 'Where you live or the seller works', 'Time since the problem (generally 2 years)'], 'Consumer Protection Act 2019; Jurisdiction Rules 2021', 'refund-refused', ['consumer court', 'e-jagriti', 'consumer forum']);
  Q('shopping', 'consumer-time', 'Is there a time limit for consumer complaints?',
    'Generally yes — two years from when the problem arose. A commission can accept a late complaint if you show sufficient cause for the delay.',
    ['When the cause of action arose', 'Reasons for delay'], 'Consumer Protection Act 2019 s.69', 'refund-refused', ['consumer limitation']);
  Q('shopping', 'insurance-rejected', 'My insurance claim was rejected. Where can I complain?',
    'First the insurer\'s grievance officer (or the IRDAI Bima Bharosa portal). If it rejects your grievance or doesn\'t reply in 30 days, you can go to the Insurance Ombudsman for free, or to a consumer commission.',
    ['The rejection reason', 'Claim amount', 'Policy wording'], 'Insurance Ombudsman Rules 2017; IRDAI regulations', 'insurance-claim', ['claim rejected', 'insurance ombudsman']);
  Q('shopping', 'rera-or-consumer', 'Builder delayed my flat: RERA or consumer court?',
    'Both are available for many buyers. RERA lets you claim a refund with interest or interest for each month of delay. Consumer commissions can also award compensation. Your advocate will advise which is faster and more suitable for your project.',
    ['Whether the project is RERA-registered', 'Whether you want a refund or the flat'], 'RERA 2016 s.18; Imperia Structures v. Anil Patni (2020)', 'builder-delay', ['rera complaint', 'flat delay']);

  /* ---------- Home ---------- */
  Q('home', 'rent-11-months', 'Why are rent agreements made for 11 months?',
    'Leases of a year or more must be registered, which costs stamp duty and registration fees. An 11-month agreement avoids that. It is still valid between the parties, but registration questions can arise if it is renewed repeatedly — check your state\'s rules.',
    ['Your state\'s stamp and rent laws', 'Duration and renewals'], 'Registration Act s.17; Transfer of Property Act s.107', 'eviction-tenancy', ['11 month agreement', 'rent agreement validity']);
  Q('home', 'landlord-evict', 'Can my landlord throw me out without a court order?',
    'No. A landlord must follow due process — usually notice and, if you don\'t leave, an eviction order. Changing locks, removing belongings or cutting water or electricity to force you out is not lawful.',
    ['State rent law', 'Rent agreement terms'], 'State rent control laws; Transfer of Property Act', 'eviction-tenancy', ['eviction', 'landlord forcing']);
  Q('home', 'deposit-return', 'How do I get my security deposit back?',
    'Ask in writing after handing over the keys, with proof of the home\'s condition and paid bills. If refused, a legal notice and then a civil or consumer claim (depending on facts) are the usual routes. Some states cap deposits.',
    ['Rent agreement', 'Condition proof', 'State law'], 'Contract Act; state rent laws', 'rental-security-deposit', ['deposit refund']);
  Q('home', 'mutation-title', 'Does mutation in land records make someone the owner?',
    'No. Mutation updates revenue records for tax and possession; it does not create or end ownership. Title is decided by deeds and, in disputes, by civil courts.',
    ['The title documents', 'How the mutation was done'], 'Settled Supreme Court position (e.g. Jitendra Singh v. State of MP, 2021)', 'land-encroachment', ['mutation', 'dakhil kharij']);
  Q('home', 'adverse-possession', 'Can someone become the owner of my land by occupying it for years?',
    'Possibly. Open, continuous and hostile possession for 12 years (30 years for government land) can lead to a claim of adverse possession. That\'s why you should act quickly when someone occupies your land.',

  Q('police', 'fir-refused', 'Police are refusing to register my FIR. What can I do?',
    'Give a written complaint and get a receipt. If they still refuse, send it to the Superintendent of Police. If nothing happens, you can apply to a Magistrate to direct registration. You can also file a "zero FIR" at any station or an e-FIR.',

  Q('police', 'anticipatory-bail', 'What is anticipatory bail and when do I need it?',

  Q('police', 'arrest-rights', 'What are my rights if I am arrested?',

  function makeAdvCode(id, mustIds, name, note) {
    const idx = BUILT.findIndex((i) => i.id === id); const ev = BY_ID[id].evidence;
    let mask = 0; mustIds.forEach((m) => { const k = ev.findIndex((e) => e.id === m); if (k >= 0) mask += 2 ** k; });
    return ['a', idx.toString(36), mask.toString(36), encodeHex(name.trim()), encodeHex(note.trim())].join('-');
  }
  function applyAdvLink(raw) {
    const p = raw.split('-'); const iss = BUILT[parseInt(p[1], 36)]; if (!iss) { location.hash = 'home'; return; }

      if (S.history.length === 0) { TRACK.once('intro', { g: id }); TRACK.once('start', { g: id }); }
      TRACK.once('step', { g: id, n: Math.min(S.history.length, 60) });
    }
    if (view === 'list' || view === 'brk') {
      TRACK.once('list', { g: id });
      if (S.stage === 'deep' && !currentQ()) TRACK.once('done', { g: id });
    }
    if (view === 'report') TRACK.once('report', { g: id });
    if (view === 'quiz' || view === 'list' || view === 'urgent') {
      try { E.urgent(iss, S.answers).filter((u) => u.level === 'now').forEach((u) => TRACK.once('urg', { g: id, x: u.id })); } catch (e) { /* ignore */ }
    }
  }
  let searchT = null;
  function trackSearch(qv) {
    clearTimeout(searchT); const v = String(qv || '').trim(); if (v.length < 3) return;
    searchT = setTimeout(() => { let n = 0; try { n = searchAll(v).length; } catch (e) { /* ignore */ } TRACK.ev('search', { n, x: v }); }, 1500);
  }
  try { const fi = document.createElement('link'); fi.rel = 'icon'; fi.href = window.ER_BRAND.icon; document.head.appendChild(fi); } catch (e) { /* none */ }
  applyLangDom(); dictLoad();
  render();
})();
</script>

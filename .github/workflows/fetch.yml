name: Fetch law sources
on:
  push:
    branches: [law-sources]
    paths: ['.github/workflows/fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official text and extract
        run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null
          mkdir -p sources
          curl -sSL -A 'Mozilla/5.0' --retry 3 -o sources/limitation-act-1963.pdf 'https://www.thc.nic.in/Central%20Governmental%20Acts/Limitation%20Act,%202019.pdf'
          pdftotext -layout sources/limitation-act-1963.pdf sources/limitation-act-1963.txt
          sha256sum sources/*.pdf > sources/SHA256SUMS
          echo "Source: https://www.thc.nic.in/Central Governmental Acts/Limitation Act, 2019.pdf (Tripura High Court, official). Fetched $(date -u +%FT%TZ)" > sources/README.txt
          wc -c sources/*
      - name: Commit
        run: |
          git config user.name saboot-law-bot; git config user.email actions@users.noreply.github.com
          git add sources; git commit -m "Official text: Limitation Act, 1963" || true
          git push

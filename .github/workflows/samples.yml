name: Read-aloud samples
on:
  push:
    branches: [law-sources]
    paths: ['samples/req.json', '.github/workflows/samples.yml']
permissions:
  contents: write
jobs:
  speak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq install -y ffmpeg jq >/dev/null
      - name: Ask saboot.org to read each sample
        run: |
          n=$(jq length samples/req.json)
          for i in $(seq 0 $((n-1))); do
            name=$(jq -r ".[$i].name" samples/req.json)
            jq -c ".[$i] | {lang,text,part}" samples/req.json > /tmp/b.json
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST https://saboot.org/api/speak -H 'content-type: application/json' -H 'origin: https://saboot.org' --max-time 90 --data @/tmp/b.json)
            echo "$name $code $(head -c 120 /tmp/r.json | tr -d '\n' | sed 's/"audio":"[^"]*/"audio":"…/')"
            if [ "$code" = 200 ]; then jq -r .audio /tmp/r.json | base64 -d > /tmp/$name.wav && ffmpeg -loglevel error -y -i /tmp/$name.wav -codec:a libmp3lame -b:a 64k samples/$name.mp3; else echo "$name $code" >> samples/errors.txt; fi
            sleep 4
          done
          ls -la samples
      - run: |
          git config user.name saboot-law-bot; git config user.email actions@users.noreply.github.com
          git add samples; git commit -m "Read-aloud samples" || true
          for i in 1 2 3; do git pull -q --rebase origin law-sources && git push && break; sleep 5; done
